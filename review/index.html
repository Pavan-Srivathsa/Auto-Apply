<!doctype html>
<meta charset="utf-8">
<title>Job Autopilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
  /* Terminal: monospace, square corners, hard 1-2px rules, black on white.
     Colour is signal only: purple = the agent is on it, green = it needs
     you (or is done), red = rejected or failed. */
  :root {
    --bg: #fff; --panel: #fff; --ink: #000; --muted: #5a5a5a; --line: #000; --accent: #000;
    --purple: #6a00ff; --purple-soft: #ece0ff;
    --green: #00873a; --green-soft: #d7f5df; --green-wash: rgba(0, 135, 58, .08);
    --red: #e00000; --red-soft: #ffdcdc;
    --warn: #b85c00; --warnbg: #fff0d6;
    --ok: var(--green); --okbg: var(--green-soft); --stop: var(--red); --stopbg: var(--red-soft);
    --add: var(--green); --addbg: var(--green-soft); --del: var(--red); --delbg: var(--red-soft);
    --focus: #0044ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --panel: #000; --ink: #fff; --muted: #a0a0a0; --line: #fff; --accent: #fff;
      --purple: #b48cff; --purple-soft: #261546;
      --green: #3ddc84; --green-soft: #0f3320; --green-wash: rgba(61, 220, 132, .08);
      --red: #ff5c5c; --red-soft: #401212;
      --warn: #ffb454; --warnbg: #3a2600;
      --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The window is the frame: header, then two panes that scroll. The
       page itself never scrolls, so the header needs no magic height. */
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Scrollbars in the page's ink: square, thin, always drawn. macOS hides
     overlay scrollbars until something moves, so the two panes read as one
     page that will not scroll; styling them keeps them on screen. */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-corner { background: transparent; }
  nav::-webkit-scrollbar-thumb { border-color: var(--panel); }
  header {
    display: flex; align-items: center; gap: 1rem; padding: .7rem 16px;
    border-bottom: 2px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 13px; margin: 0; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  header h1::before { content: "▮ "; color: var(--green); }
  header .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* Profile status: a fact, not a switch. Grey until one story is written,
     green after; clicking it opens the Profile tab. */
  header .pstat { margin-left: auto; display: inline-flex; align-items: center; gap: .5rem; cursor: pointer;
                  background: none; border: 2px solid var(--muted); color: var(--muted); font: inherit;
                  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; padding: .3rem .6rem; }
  header .pstat::before { content: ""; width: 8px; height: 8px; background: currentColor; }
  header .pstat[data-on="1"] { border-color: var(--green); color: var(--green); }
  header .pstat[data-on="2"] { border-color: var(--line); }
  header .pstat span.on { color: var(--green); }
  header .tabs { display: flex; gap: 0; }
  header .tabs button { background: none; border: 1px solid var(--line); padding: .3rem .7rem;
                        color: var(--muted); font: inherit; cursor: pointer; text-transform: uppercase;
                        letter-spacing: .08em; font-size: 11px; }
  header .tabs button + button { border-left: 0; }
  header .tabs button[aria-current="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

  /* Profile tab */
  .chat { display: flex; flex-direction: column; gap: .6rem; margin: 1rem 0; }
  .msg { max-width: 72ch; padding: .6rem .9rem; white-space: pre-wrap;
         line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--ink); color: var(--bg); }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 2px solid var(--purple); }
  .msg.bot.live::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .composer { display: flex; gap: .5rem; align-items: flex-end; position: sticky; bottom: 0;
              background: var(--bg); padding: .6rem 0 1rem; }
  .composer textarea { min-height: 3rem; flex: 1; }
  button.mic { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: 1px solid var(--line);
               background: var(--panel); font-size: 1.1rem; cursor: pointer; color: inherit; }
  button.mic.on { background: var(--stop); border-color: var(--stop); color: #fff;
                  animation: pulse 1.2s ease-in-out infinite; }
  button.mic.busy { opacity: .5; cursor: progress; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--stop) 25%, transparent); } }
  .voicebar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
              color: var(--muted); font-size: .82rem; margin: .4rem 0; }
  /* The chat fills the pane: bubbles the full width, the head one line,
     mic and voice two dots in it, the status line only when something
     needs downloading or installing. */
  .chat .msg { max-width: none; }
  /* While the chat is up the pane is a column the height of the window:
     the transcript takes what is left and scrolls, the composer sits on
     the bottom edge whatever the length of the conversation. */
  section.detail.chatpane { display: flex; flex-direction: column; height: 100%;
                            padding-bottom: 1rem; overflow: hidden; box-sizing: border-box; }
  .chatpane .head, .chatpane .voicebar { flex: none; }
  .chatpane .chat { flex: 1; min-height: 0; overflow-y: auto; margin: .4rem 0; }
  .chatpane .composer { flex: none; position: static; padding: .4rem 0 0; }
  .head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .head .dot.ok { background: var(--green); }
  .head .dot.bad { background: var(--red); }
  .voicebar[hidden] { display: none; }
  .voicebar progress { width: 120px; height: 8px; }
  nav .cov { display: block; color: var(--muted); font-size: 11px; margin-top: .15rem;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav .cov .ok { color: var(--ok); }
  .hint .ok { color: var(--green); }
  nav .cov .pend { color: var(--warn); }
  nav .cov .err { color: var(--stop); }
  /* The preliminary interview: one question per screen. */
  .qform { max-width: 60ch; padding: 1.2rem 1.4rem; }
  .qform .sec { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
  .qform .q { font-size: 1.1rem; font-weight: 700; margin: .5rem 0 .3rem; line-height: 1.35; }
  .qform input[type=text] { width: 100%; padding: .6rem; border: 2px solid var(--line); background: var(--bg);
                            color: inherit; font: inherit; }
  .qform input[type=text]:focus, .qform select:focus { outline: none; border-color: var(--ink); }
  .qform .prog { height: 6px; background: var(--line); margin: 0 0 1rem; }
  .qform .prog i { display: block; height: 100%; background: var(--purple); }
  .qform .choices { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0; }
  .qform .choices button.act[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .qform .prot { color: var(--muted); font-size: 12px; margin: .3rem 0 0; }
  table.kv { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.kv td { padding: .35rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 40%; }
  table.kv td.empty { color: var(--muted); font-style: italic; }
  table.kv.corr td:first-child { width: 28%; }
  /* What they want, what you have: the brief, one row per requirement. */
  .fit .sum { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .6rem; font-size: 13px; }
  .fit .sum strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .fit table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .fit td { padding: .45rem .5rem; border-top: 1px solid var(--line); vertical-align: top; }
  .fit td.ask { width: 34%; font-weight: 600; }
  .fit td.ask .kind { display: block; font-weight: 400; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .fit td.have q { quotes: none; }
  .fit td.have .src { color: var(--muted); font-size: 11px; margin-left: .3rem; }
  .fit td.gap { color: var(--red); font-style: italic; }
  .fit td.marks { width: 7.5rem; white-space: nowrap; font-size: 12px; text-align: right; }
  .fit .yes { color: var(--green); } .fit .no { color: var(--muted); }
  .fit .verdict { border: 2px solid var(--ink); padding: .6rem .8rem; margin-bottom: .7rem; font-size: 14px; }
  .fit .verdict strong { text-transform: uppercase; letter-spacing: .06em; margin-right: .5rem; }
  .fit .verdict.qualified strong { color: var(--green); }
  .fit .verdict.stretch strong { color: var(--warn, #b8860b); }
  .fit .verdict.not_qualified { border-color: var(--red); } .fit .verdict.not_qualified strong { color: var(--red); }
  .fit .level { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-top: .3rem; }
  .fit .level.missing { color: var(--red); } .fit .level.partly { color: var(--warn, #b8860b); } .fit .level.meets { color: var(--green); }
  .fit .why { display: block; color: var(--muted); font-size: 12px; margin-top: .2rem; }
  /* Scout's one list: band filters and source chips. */
  .bands { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin: .2rem 0 .8rem; }
  .bands .band { border: 2px solid var(--line); background: var(--bg); color: var(--ink); padding: .25rem .6rem; font: inherit; font-size: 13px; cursor: pointer; }
  .bands .band.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .bands .band b { font-variant-numeric: tabular-nums; margin-left: .2rem; }
  .bands input[type=search] { flex: 1; min-width: 12rem; padding: .3rem .5rem; font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); border: 2px solid var(--line); }
  .job { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: start; }
  .job .t a { color: var(--ink); text-decoration: none; } .job .t a:hover { text-decoration: underline; }
  .job .go { grid-row: 1 / span 3; grid-column: 2; align-self: center; }
  .job .fitline { margin-top: .25rem; }
  .fitline .score { display: inline-block; min-width: 5.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .src-chip { display: inline-block; border: 1px solid var(--line); padding: 0 .35rem; margin-left: .35rem; font-size: 11px; color: var(--muted); }
  .age.fresh { color: var(--green); font-weight: 700; }
  .src-chip.rep { border-color: var(--warn, #b8860b); color: var(--warn, #b8860b); }
  .hit .company { color: var(--muted); margin-left: .35rem; font-size: 13px; }
  table.tracker tr[data-job] { cursor: pointer; } table.tracker tr[data-job]:hover td { background: var(--line); }
  table.tracker td { vertical-align: top; font-size: 13px; }
  table.tracker td:first-child { width: 34%; }
  table.tracker td:nth-child(3), table.tracker td:nth-child(4) { white-space: nowrap; width: 8.5rem; }
  table.tracker td:nth-child(2) { width: 14%; } table.tracker tr.th td { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  table.srcs tr { cursor: pointer; } table.srcs tr:hover td { background: var(--line); }
  /* The ML/DS bullet review: each rewritten bullet against its own source. */
  .breview .row { border-top: 1px solid var(--line); padding: .55rem 0; font-size: 13px; display: grid; grid-template-columns: 5.5rem 1fr; gap: .2rem .8rem; }
  .breview .verdict { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  .breview .PASS { color: var(--green); } .breview .WARN { color: var(--warn, #b8860b); }
  .breview .FAIL { color: var(--red); } .breview .UNKNOWN { color: var(--muted); }
  .breview .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: .35rem; }
  .breview .line { display: block; margin: .1rem 0; }
  .breview .issue { color: var(--red); } .breview .ev q { quotes: none; color: var(--muted); }
  .breview .ctl { margin-top: .3rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
  .breview .ctl button[aria-pressed="true"] { outline: 2px solid var(--ink); }
  .breview .meta { color: var(--muted); font-size: 11px; }
  .breview details { margin-top: .4rem; } .breview summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) { .fit td.marks { width: auto; } .fit td.ask { width: auto; } }
  table.kv.corr tr.th td { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  table.kv.corr td.was { color: var(--red); text-decoration: line-through; }
  .doc { padding: .5rem 1rem; line-height: 1.55; max-width: 80ch; }
  .doc h1 { font-size: 1.15rem; margin: .6rem 0; }
  .doc h2 { font-size: .95rem; margin: 1rem 0 .3rem; }
  .doc pre { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; background: var(--bg);
             padding: .6rem; border: 1px solid var(--line); }
  /* The orb: the voice of the interview. Floats over the chat. A flat ring
     in the page's own ink: page-colour fill, ink stroke, hard offset shadow
     like the decision button. The outline is a soft body (see the Bubble
     module) that ripples with the audio. One flat core inside carries the
     state colour: green only while listening (you), purple while speaking
     (agent), red when paused or broken. Thinking is an arc sweeping the
     rim, pushing the wall out ahead of it. Nothing glows. */
  .orbwrap { position: fixed; right: 28px; bottom: 96px; z-index: 20; }
  .orb { --level: 0; --size: 104px; --tone: var(--muted); width: var(--size); height: var(--size); position: relative; cursor: grab;
         display: grid; place-items: center; touch-action: none; }
  .orb:active { cursor: grabbing; }
  .orb svg { position: absolute; inset: -14%; width: 128%; height: 128%; overflow: visible; }
  .orb .shadow { fill: var(--ink); transition: opacity .2s; }
  .orb .ring { fill: var(--bg); stroke: var(--ink); stroke-width: 3; }
  .orb .core { fill: var(--tone); transition: fill .3s; }
  .orb .arc { fill: none; stroke: var(--ink); stroke-width: 4; }
  .orb.listening { --tone: var(--green); }
  .orb.speaking { --tone: var(--purple); }
  .orb.thinking { --tone: var(--ink); }
  .orb.paused, .orb.error { --tone: var(--red); }
  .orb.paused .ring { stroke: var(--red); stroke-dasharray: 6 4; }
  .orb.paused .shadow { opacity: 0; }
  .orb.error .ring { stroke: var(--red); }
  .orb .orblabel { position: relative; z-index: 1; color: var(--tone); font-weight: 600; font-size: 10px;
                   letter-spacing: .1em; text-transform: uppercase; user-select: none; }
  .doctabs { display: flex; gap: .25rem; margin: .8rem 0; }
  .doctabs button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  /* The list and the job scroll on their own: reading a long application
     never moves the list, and the list never drags the job with it. The
     page itself does not scroll; each pane does. */
  main { display: grid; grid-template-columns: 300px 1fr; flex: 1; min-height: 0; overflow: hidden; }
  main > nav, main > section.detail { overflow-y: auto; overflow-x: hidden; min-height: 0; }
  main > section.detail.chatpane { overflow: hidden; }
  @media (max-width: 800px) {
    body { height: auto; overflow: visible; }
    main { grid-template-columns: 1fr; flex: none; overflow: visible; }
    main > nav, main > section.detail { overflow: visible; }
    nav { border-right: 0; border-bottom: 2px solid var(--line); }
  }

  /* The list: one open bucket (in flight) and two shelves that stay
     closed. Each in-flight row is washed in its bucket's colour and ends
     in one verb: what the agent is doing, or what you should do. */
  nav { border-right: 2px solid var(--line); background: var(--panel); padding-bottom: 6rem; }
  nav .group {
    display: flex; align-items: baseline; gap: .5rem; padding: .9rem 16px .35rem;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  nav .group .n { margin-left: auto; font-variant-numeric: tabular-nums; }
  nav .row {
    display: block; width: 100%; text-align: left; padding: .7rem 5.4rem .7rem 16px;
    background: var(--tone-soft, transparent); border: 0; border-bottom: 1px solid var(--line);
    color: inherit; font: inherit; cursor: pointer; position: relative;
  }
  nav .row:first-of-type { border-top: 1px solid var(--line); }
  nav .row[data-tone="agent"] { --tone: var(--purple); --tone-soft: var(--purple-soft); }
  nav .row[data-tone="you"]   { --tone: var(--green);  --tone-soft: var(--green-soft); }
  nav .row[data-tone="done"]  { --tone: var(--green);  --tone-soft: transparent; }
  nav .row[data-tone="stop"]  { --tone: var(--red);    --tone-soft: transparent; }
  nav .row[aria-current="true"] { background: var(--ink); color: var(--bg); --muted: var(--bg); --tone: var(--bg); }
  nav .row .role { display: block; font-weight: 600; text-transform: uppercase; font-size: 12px;
                   letter-spacing: .03em; line-height: 1.3; }
  nav .row .co { display: block; color: var(--muted); font-size: 11px; margin-top: .15rem; }
  nav .row .why { display: block; color: var(--red); font-size: 11px; margin-top: .15rem; }
  nav .row[aria-current="true"] .why { color: var(--bg); }
  nav .row .verb { position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
                   font-size: 11px; font-weight: 600; color: var(--tone); text-transform: uppercase; letter-spacing: .06em; }
  nav .row[data-tone="you"] .verb { background: var(--tone); color: var(--bg); padding: .35rem .55rem; }
  nav .row[aria-current="true"][data-tone="you"] .verb { color: var(--ink); }
  nav .row[data-live="1"] .verb::after { content: "…"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -20% 0 0); } }
  @media (prefers-reduced-motion: reduce) { nav .row[data-live="1"] .verb::after { animation: none; } }
  nav .shelf {
    display: flex; align-items: center; gap: .5rem; width: calc(100% - 32px); margin: .6rem 16px 0;
    padding: .55rem .7rem; border: 2px solid var(--line); background: transparent; color: var(--ink);
    cursor: pointer; font: inherit; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; font-weight: 600;
  }
  nav .shelf .dot { width: 8px; height: 8px; background: var(--tone); }
  nav .shelf[data-tone="done"] { --tone: var(--green); }
  nav .shelf[data-tone="stop"] { --tone: var(--red); }
  nav .shelf .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav .shelf .chev { color: var(--muted); }
  nav .shelf[aria-expanded="true"] { background: var(--ink); color: var(--bg); --muted: var(--bg); }
  nav .shelfrows { margin: 0 16px; border: 2px solid var(--line); border-top: 0; }
  nav .shelfrows .row { padding-right: 16px; }
  nav .shelfrows .row:last-child { border-bottom: 0; }
  nav .empty { padding: 1rem 16px; }

  /* Detail: washed in the job's colour. Green means the floating button at
     the bottom right is what happens next. */
  section.detail { padding: 1.2rem 16px 8rem; position: relative; min-width: 0; overflow-x: hidden; }
  section.detail.you   { background: linear-gradient(var(--green-wash), var(--green-wash)), var(--bg); }
  section.detail.agent { background: linear-gradient(var(--purple-soft), var(--purple-soft)), var(--bg); }
  .head { display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: baseline; margin-bottom: .8rem; }
  .head h2 { margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.2; text-wrap: balance; }
  .head a { font-size: 11px; }
  .head a { color: var(--ink); }

  .state { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .55rem;
           font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
           border: 2px solid var(--line); color: var(--ink); }
  .state.wait { border-color: var(--warn); color: var(--warn); }
  .state.go { border-color: var(--green); color: var(--green); }
  .state.stop { border-color: var(--red); color: var(--red); }
  .state.agent { border-color: var(--purple); color: var(--purple); }

  .actions { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; align-items: center; }
  button.act, label.act, a.act {
    padding: .5rem .9rem; border: 2px solid var(--line);
    background: var(--panel); color: inherit; font: inherit; cursor: pointer;
    text-transform: uppercase; font-size: 11px; letter-spacing: .08em; font-weight: 600;
  }
  button.act.primary, label.act.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  a.act { text-decoration: none; display: inline-block; }
  label.act[disabled], a.act[disabled] { opacity: .45; pointer-events: none; }
  button.act.danger { color: var(--red); border-color: var(--red); }
  button.act.opus { color: var(--green); border-color: var(--green); }
  button.act.opus:hover { background: var(--green); color: var(--bg); }
  button.act:disabled { opacity: .45; cursor: not-allowed; }
  /* The native file control cannot be styled, so the label is the button. */
  label.act { display: inline-flex; align-items: center; gap: .5rem; line-height: 1.2; }
  label.act::before { content: "+"; font-size: 15px; font-weight: 800; }

<script>
const $ = (id) => document.getElementById(id);
let jobs = [];
// The job the URL names (the capture's "Open in autopilot" lands on
// /#<id>); the first in flight otherwise.
let current = location.hash.length > 1 ? location.hash.slice(1) : null;
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== current && view === "jobs") show(id);
});
// The status the open detail was drawn with. The list polls every five
// seconds; when the open job's status moves (a fill finishing, a pipeline
// landing), the detail is redrawn, otherwise it is left alone so nothing
// under the cursor jumps.
let shownStatus = null;
let reasons = [];
const outreachSlide = {};
let outreachKeyHandler = null;

const LABEL = {
  queued: "queued", tailoring: "tailoring…", awaiting_review: "needs your review",
  approved: "approved, ready to fill", filling: "filling…",
  filled: "filled, needs your check", submitted: "submitted",
  skipped: "rejected", failed: "failed",
};

// Three buckets. "you" = the next move is yours and the page is green for
// it; "agent" = purple, leave it alone; the rest sit on closed shelves.
const BUCKET = {
  awaiting_review: "you", filled: "you",
  queued: "agent", tailoring: "agent", approved: "agent", filling: "agent",
  submitted: "done", skipped: "stop", failed: "stop",
};
// The one word at the end of an in-flight row.
const VERB = {
  awaiting_review: "Approve", filled: "Submit",
  queued: "queued", tailoring: "tailoring", approved: "starting", filling: "filling",
};
const LIVE = new Set(["tailoring", "approved", "filling"]);
// "you" rows first, then the agent's, newest first inside each.
const ORDER = ["awaiting_review", "filled", "filling", "approved", "tailoring", "queued"];
// Newest first, everywhere. The shelves used to show the queue's own order,
// which is oldest first: the job just submitted or just failed sat at the
// bottom of a closed shelf and read as gone.
const NEWEST = (a, b) => (b.added_at || "").localeCompare(a.added_at || "");

const TONE = {
  awaiting_review: "wait", filled: "wait", approved: "agent", filling: "agent",
  tailoring: "agent", queued: "agent", submitted: "go", skipped: "stop", failed: "stop",
};

// Shelves open on a click and close on the next; nothing remembers them.
const openShelves = new Set();

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const err = new Error(typeof body.detail === "string" ? body.detail
      : body.detail?.message || `HTTP ${res.status}`);
    err.detail = body.detail;
    throw err;
  }
  return res.json();
}

function switchView(name) {

  $("tabJobs").setAttribute("aria-current", name === "jobs");
  $("tabProfile").setAttribute("aria-current", name === "profile");

  $("tabPrompts").setAttribute("aria-current", name === "prompts");

async function loadList() {
  if (view !== "jobs") return;
  jobs = await api("/jobs");
  const open = current && jobs.find((j) => j.id === current);
  // Not drawn yet (the URL named it), or its status moved: draw it.
  if (open && (!shownStatus || open.status !== shownStatus)) show(current);
  const waiting = jobs.filter((j) => BUCKET[j.status] === "you");
  const inflight = jobs.filter((j) => ["you", "agent"].includes(BUCKET[j.status]))
    .sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || NEWEST(a, b));
  const applied = jobs.filter((j) => BUCKET[j.status] === "done").sort(NEWEST);
  const rejected = jobs.filter((j) => BUCKET[j.status] === "stop").sort(NEWEST);
  $("count").textContent = jobs.length
    ? `${inflight.length} in flight · ${waiting.length} need you`
    : "";

  const row = (j) => `
      <button class="row" data-id="${j.id}" data-tone="${BUCKET[j.status]}"
              data-live="${LIVE.has(j.status) ? 1 : 0}" aria-current="${j.id === current}">
        <span class="role">${escape(j.title || j.url)}</span>
        <span class="co">${escape(j.company || j.source || "")}</span>
        ${j.status === "skipped" && j.reject_reason
          ? `<span class="why">${escape(reasonLabel(j.reject_reason))}${
              j.reject_note ? " — " + escape(j.reject_note) : ""}</span>`
          : j.status === "failed" ? `<span class="why">failed</span>` : ""}
        ${VERB[j.status] ? `<span class="verb">${VERB[j.status]}</span>` : ""}
      </button>`;
  const shelf = (name, tone, group) => `
      <button class="shelf" data-shelf="${name}" data-tone="${tone}"
              aria-expanded="${openShelves.has(name)}">
        <span class="dot"></span>${name}<span class="n">${group.length}</span>
        <span class="chev">${openShelves.has(name) ? "▾" : "▸"}</span>
      </button>
      ${openShelves.has(name) && group.length
        ? `<div class="shelfrows">${group.map(row).join("")}</div>` : ""}`;

  let html = `<div class="group">In flight <span class="n">${inflight.length}</span></div>`;
  html += inflight.length ? inflight.map(row).join("")
    : `<div class="empty hint">Nothing in flight.</div>`;
  html += shelf("applied", "done", applied);
  html += shelf("rejected", "stop", rejected);
  $("list").innerHTML = html;

  for (const button of $("list").querySelectorAll(".row")) {
    button.onclick = () => show(button.dataset.id);
  }
  for (const button of $("list").querySelectorAll(".shelf")) {
    button.onclick = () => {
      const name = button.dataset.shelf;
      if (openShelves.has(name)) openShelves.delete(name); else openShelves.add(name);
      loadList();
    };
  }

  // The job open by default is the first in flight (the list's own order:
  // needs you first, then the agent's), never one on a closed shelf. With
  // nothing in flight the pane says so instead of showing the last
  // submitted or rejected job.
  if (!jobs.length) {
    $("detail").innerHTML = `<p class="empty">Queue is empty. Right-click a posting in
      Chrome and choose “Add this job to autopilot”. Tailoring starts on its own.</p>`;
  } else if (!current || !jobs.some((j) => j.id === current)) {
    if (inflight.length) show(inflight[0].id);
    else {
      current = null; shownStatus = null;
      $("detail").className = "detail";
      $("detail").innerHTML = `<p class="empty">Nothing in flight. Everything here is submitted or rejected;
        open one from the shelves, or add a job from Jobright.</p>`;
    }
  }
}

function reasonLabel(value) {
  return (reasons.find((r) => r.value === value) || {}).label || value;
}

// What the job asks for against what the candidate has (tailor.brief), and
// whether the finished resume and letter answer each item. The review the
// person wants to do before pressing Apply.
function fitHtml(fit) {
  if (!fit || !fit.rows || !fit.rows.length) return "";
  const pct = (x) => x == null ? "" : ` <span class="hint" title="Jev's confidence that this line really meets the requirement">${Math.round(x * 100)}%</span>`;
  const mark = (v, label) => v == null ? "" : `<span class="${v ? "yes" : "no"}">${v ? "✓" : "·"} ${label}</span>`;
  const rows = fit.rows.map((r) => `<tr>
      <td class="ask"><span class="kind">${r.kind === "must" ? "Required" : "Nice to have"}</span>${escape(r.text)}
        ${r.level ? `<span class="level ${r.level}">${r.level === "meets" ? "Meets" : r.level === "partly" ? "Partly" : "Missing"}</span>` : ""}
        ${r.reason ? `<span class="why">${escape(r.reason)}</span>` : ""}</td>
      ${r.gap ? `<td class="gap">Nothing on file. Left out rather than claimed.</td>`
              : `<td class="have"><q>${escape(r.evidence)}</q><span class="src">${escape(r.where === "profile" ? "story" : "resume")}</span>${pct(r.strength)}</td>`}
      <td class="marks">${mark(r.in_resume, "resume")}<br>${mark(r.in_letter, "letter")}</td></tr>`).join("");
  const scoreOf = (label, r) => r ? `<span>${label} <strong>${r.score}/10</strong>${
      r.first && r.first !== r.score ? ` <span class="hint">from ${r.first}</span>` : ""}</span>` : "";
  const letterScore = scoreOf("Resume", fit.resume) + scoreOf("Cover letter", fit.letter);
  return `<h3>What they want, what you have</h3>
    <div class="card fit">
      ${fit.verdict ? `<div class="verdict ${fit.verdict.call}"><strong>${
          {qualified: "Qualified", stretch: "Stretch", not_qualified: "Not qualified"}[fit.verdict.call] || ""}</strong>${
          escape(fit.verdict.summary.replace(/^(Qualified|Stretch|Not qualified):\s*/, ""))}</div>` : ""}
      <div class="sum">
        <span>Required, answered in the resume <strong>${fit.in_resume}/${fit.musts}</strong></span>
        ${fit.musts_gap ? `<span>Required with nothing on file <strong style="color:var(--red)">${fit.musts_gap}</strong></span>` : ""}
        ${letterScore}
        ${fit.ats ? `<span>ATS keywords <strong>${fit.ats.present}/${fit.ats.total}</strong></span>` : ""}
        <span class="hint">${fit.judged_by_jev ? "Evidence checked by Jev." : "Evidence checked against your files."}</span>
      </div>
      ${fit.ats && (fit.ats.missing_fixable.length || fit.ats.missing_no_evidence.length) ? `<div class="sum hint">
        ${fit.ats.missing_fixable.length ? `<span>Missing, but on file: ${fit.ats.missing_fixable.map(escape).join(", ")}</span>` : ""}
        ${fit.ats.missing_no_evidence.length ? `<span>Missing, nothing on file (left out): ${fit.ats.missing_no_evidence.map(escape).join(", ")}</span>` : ""}
      </div>` : ""}
      <table>${rows}</table>
    </div>`;
}

// The ML/DS bullet review (tailor/reviewer.py): every rewritten bullet next to
// what it was rewritten from, the verdict, the issue and the evidence. A
// verdict is advice and a gate, never a score; accept clears a warning for
// this job, reject puts the master's wording back once "Apply" is pressed.
function bulletsHtml(br) {
  if (!br || !br.bullets) return "";
  const changed = br.bullets.filter((b) => b.method !== "unchanged" || b.decision);
  window.__bulletRows = Object.fromEntries(br.bullets.map((b) => [b.index, b]));
  const c = br.counts || {};
  const head = `<div class="sum">
      <span>Pass <strong style="color:var(--green)">${c.PASS || 0}</strong></span>
      <span>Warn <strong style="color:var(--warn,#b8860b)">${c.WARN || 0}</strong></span>
      <span>Fail <strong style="color:var(--red)">${c.FAIL || 0}</strong></span>
      ${c.UNKNOWN ? `<span>Not reviewed <strong>${c.UNKNOWN}</strong></span>` : ""}
      ${br.reverted && br.reverted.length ? `<span>${br.reverted.length} put back to the master's wording</span>` : ""}
      <span class="hint">${br.needs_human ? "Waits for you: nothing here auto-approves." : "Every changed bullet is backed by its source."}</span>
    </div>${br.error ? `<div class="issue">${escape(br.error)}</div>` : ""}`;
  const rows = changed.map((b) => {
    const pick = (d, label) => `<button class="small act" data-bullet="${b.index}" data-decision="${d}"
        aria-pressed="${b.decision === d}">${label}</button>`;
    return `<div class="row">
      <div><span class="verdict ${b.verdict}">${b.verdict}</span>
        <span class="meta">${b.confidence ? Math.round(b.confidence * 100) + "%" : ""} ${escape(b.method || "")}</span></div>
      <div>
        <span class="line"><span class="lbl">Was</span>${escape(b.original || "(no master bullet)")}</span>
        <span class="line"><span class="lbl">Now</span>${escape(b.rewritten)}</span>
        ${b.issue ? `<span class="line issue"><span class="lbl">Issue</span>${escape(b.issue)}</span>` : ""}
        ${b.verdict !== "PASS" && b.evidence ? `<span class="line ev"><span class="lbl">Evidence</span><q>${escape(b.evidence)}</q> <span class="meta">${escape(b.source_kind)}</span></span>` : ""}
        ${b.unverified_claims && b.unverified_claims.length ? `<span class="line meta">Not in its source: ${b.unverified_claims.map(escape).join(", ")}</span>` : ""}
        ${b.correction ? `<span class="line"><span class="lbl">Correction</span>${escape(b.correction)} <span class="meta">${escape(b.correction_verdict || "")}</span></span>` : ""}
        ${b.edited ? `<span class="line"><span class="lbl">Your edit</span>${escape(b.edited)}</span>` : ""}
        <div class="ctl">${b.verdict !== "PASS" ? pick("accept", "Accept as is") : ""}${b.original_tex && b.verdict !== "PASS" ? pick("reject", "Reject: use the master's wording") : ""}
          <button class="small act" data-edit="${b.index}">Edit…</button>
          ${b.decision ? `<button class="small act" data-bullet="${b.index}" data-decision="">Undo</button>` : ""}</div>
      </div></div>`;
  }).join("");
  const rejected = changed.some((b) => b.decision === "reject" || b.decision === "edit");
  return `<h3>Bullet review</h3>
    <div class="card fit breview">${head}${rows || `<div class="hint">No bullet changed.</div>`}
      ${rejected ? `<div class="ctl"><button class="act primary" id="bulletsApply">Apply: save a new resume with your rejections and edits</button></div>` : ""}
      ${br.rounds && br.rounds.length ? `<details><summary>Review trace (${br.rounds.length})</summary><pre class="hint">${escape(JSON.stringify(br.rounds, null, 1))}</pre></details>` : ""}
    </div>`;
}

// Career intelligence (career/, server/career.py): the funnel, calibration of
// fit against outcomes, bottlenecks and recommendations. Every rate has its
// denominator and 95% interval; below the sample floor there is no rate.
const Insights = (() => {
  let viewing = "funnel";
  let report = null;
  const SECTIONS = [["funnel", "Funnel and insights", "what happened to your applications"]];
  const pct = (r) => r && r.rate != null ? `${Math.round(r.rate * 100)}% <span class="hint">(${r.k}/${r.n}, 95% ${Math.round(r.ci95[0] * 100)}–${Math.round(r.ci95[1] * 100)}%)</span>`
                                         : `<span class="hint">${r ? `${r.k}/${r.n}` : "–"}, too few</span>`;
  function sections() { return SECTIONS.concat(Insights.extra || []); }
  function renderNav() {
    $("count").textContent = "Insights";
    $("list").innerHTML = sections().map(([key, label, hint]) => `<button class="row" data-insight="${key}"
        data-tone="agent" aria-current="${viewing === key}"><span class="role">${label}</span><span class="cov">${hint}</span></button>`).join("");
    for (const b of $("list").querySelectorAll("[data-insight]")) b.onclick = () => { viewing = b.dataset.insight; render(); };
  }
  function table(rows, label) {
    if (!rows || !rows.length) return `<p class="hint">No resolved applications in any ${label} yet.</p>`;
    return `<table class="kv"><tr><td><strong>${label}</strong></td><td>n</td><td>response</td><td>screen</td><td>interview</td></tr>
      ${rows.map((g) => `<tr><td>${escape(g.group)}</td><td>${g.n}</td><td>${pct(g.response)}</td><td>${pct(g.screen)}</td><td>${pct(g.interview)}</td></tr>`).join("")}</table>`;
  }
  async function renderFunnel() {
    report = await api("/career/report");
    const f = report.funnel, c = report.calibration, b = report.bottleneck;
    const stages = Object.entries(f.counts);
    $("detail").innerHTML = `<div class="head"><h2>Funnel and insights</h2><span class="state agent">${f.jobs} jobs</span></div>
      <p class="hint">Applications under ${report.quiet_days} days with nothing recorded are in flight and are not data points. Quiet ones count as no response yet, never as a rejection. No rate is shown below ${report.min_n} resolved applications. Record what happened on each job's page.</p>
      <div class="card fit"><div class="sum">${stages.map(([k, v]) => `<span>${k} <strong>${v}</strong></span>`).join("")}</div>
        <div class="sum hint"><span>in flight ${f.in_flight}</span><span>quiet ${f.quiet}</span><span>resolved ${f.resolved}</span></div>
        <table class="kv">${f.conversion.map((s) => `<tr><td>${s.from} → ${s.to}</td><td>${pct(s)}</td></tr>`).join("")}</table></div>
      <h3>Recommendations</h3><div class="card prose">${report.recommendations.map((r) => `<p>${escape(r.text)}</p>`).join("")}</div>
      <h3>Does the fit score predict responses?</h3><div class="card"><p><strong>${escape(c.reading)}</strong>${c.backfilled ? ` <span class="hint">(${c.backfilled} snapshots rebuilt from folders after the fact)</span>` : ""}</p>
        ${table(c.by_band, "fit band")}${table(c.by_verdict, "fit verdict")}</div>
      <h3>By role, seniority and channel</h3><div class="card">${table(c.by_role_family, "role family")}${table(c.by_seniority, "seniority")}${table(c.by_channel, "channel")}</div>
      <h3>Bottleneck</h3><div class="card prose"><p>${b.weakest_step ? `Weakest measured step: <strong>${b.weakest_step.from} → ${b.weakest_step.to}</strong>, ${pct(b.weakest_step)}.` : "No step has enough resolved applications to measure."}</p>
        ${Object.keys(b.reasons).length ? Object.entries(b.reasons).map(([basis, reasons]) => `<p><strong>${escape(basis)}</strong>: ${Object.entries(reasons).map(([r, n]) => `${escape(r)} ${n}`).join(", ")}</p>`).join("") : ""}
        <p class="hint">${escape(b.note)}</p></div>
      ${report.missing_skills.length ? `<h3>Requirements often missing where nobody answered</h3><div class="card"><table class="kv">${report.missing_skills.map((m) => `<tr><td>${escape(m.requirement)}</td><td>${m.in_no_response}/${m.of_no_response} without a response · ${m.in_response}/${m.of_response} with one</td></tr>`).join("")}</table></div>` : ""}`;
  }
  function render() {
    renderNav();
    const extra = (Insights.renderers || {})[viewing];
    if (extra) return extra();
    return renderFunnel();
  }
  return { open() { render(); }, poll() { /* a report is read on demand, not every five seconds */ }, render,
           extra: [], renderers: {} };
})();

// The outcome of one job (career/events.py): its timeline, inferred and yours,
// and what you record next. Recording never changes the job's status.
async function outcomeHtml(id) {
  let data, vocab;
  try { [data, vocab] = await Promise.all([api(`/career/jobs/${id}`), api("/career/vocabulary")]); }
  catch (err) { return ""; }
  window.__careerVocab = vocab;
  const rows = data.events.map((e) => `<tr><td>${escape(e.at.slice(0, 10))}</td><td><strong>${escape(e.event)}</strong>
      ${e.reason ? ` · ${escape(e.reason)} (${escape(e.basis || "unknown")})` : ""}</td>
      <td class="hint">${e.source === "user" ? "you" : escape(e.how)}${e.note ? ` · ${escape(e.note)}` : ""}</td></tr>`).join("");
  const o = data.outcome;
  return `<h3>Outcome</h3><div class="card"><p>Stage <strong>${escape(data.stage)}</strong> · ${escape(o.state.replace("_", " "))}${o.how ? ` <span class="hint">(${escape(o.how)})</span>` : ""}</p>
    <table class="kv">${rows}</table>
    <div class="actions"><select id="outEvent">${[...vocab.stages.slice(1), ...vocab.outcomes].map((e) => `<option>${e}</option>`).join("")}</select>
      <select id="outReason"><option value="">reason (if it ended)</option>${vocab.reasons.map((r) => `<option>${r}</option>`).join("")}</select>
      <select id="outBasis"><option value="">how you know</option>${vocab.bases.map((r) => `<option>${r}</option>`).join("")}</select>
      <input type="date" id="outAt"><input type="text" id="outNote" placeholder="note">
      <button class="act" id="outAdd">Record</button></div>

}

function wireOutcome(id) {

// Scout intelligence: every role listed now ranked by fit, the curated
// agentic-AI watchlist, and each listing's history (scout/history.py).
const FRESH = { fresh: "Fresh", open: "Open", recently_updated: "Recently updated", reposted: "Reposted",
                potentially_stale: "Potentially stale", verification_required: "Verification required" };
function roleRows(rows) {
  return rows.map((r) => `<div class="hit"><div class="t"><a href="${escape(r.url)}" target="_blank" rel="noopener">${escape(r.title)}</a>
      · ${escape(r.company || "")} <span class="hint">${escape(r.location || "")} ${escape(r.posted || "")}</span></div>
    <div class="m">${r.fit && r.fit.verdict ? `<strong>${escape(r.fit.verdict.replace("_", " "))}</strong> · ${escape((r.fit.summary || "").slice(0, 140))}` : "fit not worked out yet"}
      ${r.freshness ? ` · <span title="${escape((r.freshness.evidence || []).join("; "))}">${FRESH[r.freshness.label] || escape(r.freshness.label)}</span>` : ""}</div></div>`).join("");
}
Insights.extra.push(["discovery", "Job discovery", "every open role, by fit"],
                    ["startups", "AI startups", "the curated fifty"],
                    ["history", "Monitoring history", "reposts, stale, closed"]);
