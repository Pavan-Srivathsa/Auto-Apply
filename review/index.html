// Skills (career/skills.py): what job descriptions ask for, counted once per
// role, with the employers' own lines, the skills that come with each one,
// and how the person's resume met them. The list on the left is every skill
// by demand; the overview has the gaps and the skill sets per kind of role.
const Skills = (() => {
  let data = null, viewing = "overview", group = "all";
  const fam = (f) => f.replace("_", " ");
  const LEVEL = { meets: "you have it", partly: "partly", missing: "missing" };
  async function open() { data = await api("/career/skills"); render(); }
  function renderNav() {
    const groups = ["all", ...new Set(data.skills.map((s) => s.group))];
    $("count").textContent = `${data.skills.length} skills · ${data.roles} roles read`;
    const shown = data.skills.filter((s) => group === "all" || s.group === group);
    $("list").innerHTML = `<button class="row" data-skill="overview" data-tone="agent" aria-current="${viewing === "overview"}">
        <span class="role">Overview</span><span class="cov">gaps and skill sets by role</span></button>
      <div class="group"><select id="skillGroup" style="width:100%">${groups.map((g) => `<option ${g === group ? "selected" : ""}>${escape(g)}</option>`).join("")}</select></div>`
      + shown.map((s) => `<button class="row" data-skill="${escape(s.skill)}" data-tone="${s.missing > s.have ? "stop" : s.have >= s.roles / 2 ? "done" : "you"}" aria-current="${viewing === s.skill}">
        <span class="role">${escape(s.skill)}</span><span class="cov">${s.roles} roles · ${Math.round(s.share * 100)}% · missing ${s.missing}</span></button>`).join("");
    for (const b of $("list").querySelectorAll("[data-skill]")) b.onclick = () => { viewing = b.dataset.skill; render(); };
    $("skillGroup").onchange = (e) => { group = e.target.value; renderNav(); };
  }
  const bar = (s) => `<span class="hint">have ${s.have} · partly ${s.partly} · <span style="color:var(--red)">missing ${s.missing}</span></span>`;
  function overview() {
    return `<div class="head"><h2>Skills in demand</h2><span class="state agent">${data.roles} roles read</span></div>
      <p class="hint">Every role Autopilot has judged (${data.sources.scout || 0} from Scout, ${data.sources.application || 0} applications); each requirement line is already marked met, partly or missing against your resume and stories. Counted once per role. Pick a skill on the left for the employers' own lines.</p>
      <h3>Most asked for that you lack</h3><div class="card"><table class="kv">${data.missing_most.map((s) =>
        `<tr data-open-skill="${escape(s.skill)}" style="cursor:pointer"><td><b>${escape(s.skill)}</b> <span class="hint">${escape(s.group)}</span></td><td>${s.roles} roles</td><td>${bar(s)}</td></tr>`).join("")}</table></div>
      <h3>Skill sets by kind of role</h3>${Object.entries(data.by_family).sort((a, b) => b[1].roles - a[1].roles).map(([f, b]) => `
        <div class="card" style="padding:.6rem 1rem;margin-bottom:.6rem"><p><b>${escape(fam(f))}</b> <span class="hint">${b.roles} roles</span></p>
          <p>${b.top.map((t) => `<span class="src-chip" style="margin:0 .3rem .3rem 0">${escape(t.skill)} ${Math.round(t.share * 100)}%</span>`).join("")}</p>
          ${b.together.length ? `<p class="hint">Asked together: ${b.together.slice(0, 6).map((x) => `${x.skills.map(escape).join(" + ")} (${x.roles})`).join(" · ")}</p>` : ""}</div>`).join("")}
      <h3>By group</h3><div class="card"><table class="kv">${data.groups.map((g) => `<tr><td>${escape(g.group)}</td><td>${g.roles} asks across ${g.skills} skills</td><td><span class="hint">missing ${g.missing || 0} · partly ${g.partly || 0}</span></td></tr>`).join("")}</table></div>
      ${data.unrecognized.length ? `<details><summary>Frequent words no skill matched (${data.unrecognized.length})</summary><p class="hint">${data.unrecognized.map((u) => `${escape(u.term)} ${u.count}`).join(" · ")}</p></details>` : ""}`;
  }
  function detail(s) {
    const fams = Object.entries(s.families).sort((a, b) => b[1] - a[1]);
    return `<div class="head"><h2>${escape(s.skill)}</h2><span class="state agent">${s.roles} roles</span><span class="hint">${escape(s.group)}</span></div>
      <div class="card fit"><div class="sum"><span>Asked in <strong>${s.roles}</strong> roles (${Math.round(s.share * 100)}%)</span><span>required in <strong>${s.required}</strong></span>
        <span>you have it <strong style="color:var(--green)">${s.have}</strong></span><span>partly <strong>${s.partly}</strong></span><span>missing <strong style="color:var(--red)">${s.missing}</strong></span></div></div>
      <h3>Which roles ask for it</h3><p>${fams.map(([f, n]) => `<span class="src-chip" style="margin:0 .3rem .3rem 0">${escape(fam(f))} ${n}</span>`).join("")}</p>
      <h3>Usually asked together with</h3><p>${s.with.map((x) => `<button class="band" data-open-skill="${escape(x.skill)}">${escape(x.skill)} <b>${x.roles}</b></button>`).join(" ")}</p>
      <h3>What the job descriptions say · ${s.examples.length}</h3><div class="card">${s.examples.map((e) => `<div class="hit">
        <div class="t">“${escape(e.line)}”</div>
        <div class="m">${escape(e.title)} · ${escape(e.company)} · ${e.kind === "must" ? "required" : "nice to have"} ·
          <span class="${e.level === "missing" ? "issue" : ""}">${escape(LEVEL[e.level] || e.level || "not judged")}</span></div></div>`).join("")}</div>`;
  }
  function render() {
    renderNav();
    const s = data.skills.find((x) => x.skill === viewing);
    $("detail").innerHTML = s ? detail(s) : overview();
    for (const el of $("detail").querySelectorAll("[data-open-skill]")) el.onclick = () => { viewing = el.dataset.openSkill; render(); };
  }
  return { open };
})();

function wireBullets(id) {
  for (const button of document.querySelectorAll("[data-bullet]")) {
    button.onclick = () => act(id, () => api(`/review/${id}/bullets/${button.dataset.bullet}/decision`,
      { method: "POST", body: JSON.stringify({ decision: button.dataset.decision }) }));
  }
  for (const button of document.querySelectorAll("[data-edit]")) {
    button.onclick = () => {
      const index = Number(button.dataset.edit);
      const row = (window.__bulletRows || {})[index] || {};
      const text = prompt("Your wording for this bullet. It is checked against its source like any other, " +
                          "and kept on every later re-tailor of this job.", row.edited || row.rewritten || "");
      if (text === null || !text.trim()) return;
      act(id, () => api(`/review/${id}/bullets/${index}/decision`,
        { method: "POST", body: JSON.stringify({ decision: "edit", text }) }));
    };
  }
  if ($("bulletsApply")) $("bulletsApply").onclick = () => {
    if (!confirm("Save a new resume version with the rejected bullets back in the master's wording and your edits in?")) return;
    act(id, () => api(`/review/${id}/bullets/apply`, { method: "POST", body: "{}" }));
  };
}

async function show(id) {
  if (view !== "jobs") return;
  current = id;
  shownStatus = (jobs.find((j) => j.id === id) || {}).status || null;
  for (const button of $("list").querySelectorAll(".row")) {
    button.setAttribute("aria-current", button.dataset.id === id);
  }

  const job = jobs.find((j) => j.id === id);
  if (!job) return;
  $("detail").className = `detail ${BUCKET[job.status] || ""}`;

  if (!job.app_dir) {
    // Capturing starts the pipeline; this state normally lasts seconds. A
    // job still here was captured while the server was down, or failed
    // before it made a folder, and gets a button rather than a command.
    const running = job.status === "tailoring";
    $("detail").innerHTML = `${head(job)}
      <p class="empty">${running
        ? "Tailoring now. This page refreshes itself."
        : `Not tailored yet${job.error ? `: ${escape(job.error)}` : ""}.`}</p>
      ${running ? "" : `<div class="actions"><button class="act primary" id="processNow">Tailor it now</button></div>`}`;
    const button = $("processNow");
    if (button) button.onclick = async () => {
      button.disabled = true;
      try { await api(`/jobs/${id}/process`, { method: "POST" }); await loadList(); }
      catch (err) { alert(err.message); button.disabled = false; }
    };
    return;
  }

  let data;
  try {
    data = await api(`/review/${id}`);
  } catch (err) {
    $("detail").innerHTML = `${head(job)}<div class="banner stop">${escape(err.message)}</div>
      <div class="actions"><button class="act danger" id="deleteJob">Delete permanently…</button></div>`;
    $("deleteJob").onclick = () => deleteJob(id);
    return;
  }
  let outreach;
  try {
    outreach = await api(`/review/${id}/outreach`);
  } catch (err) {
    outreach = { contacts: [], drafts: [], error: err.message,
                 apollo_configured: false, mail_configured: false };
  }

  const reviewable = data.status === "awaiting_review";
  const filled = data.status === "filled";
  // A job stops for reasons that have nothing to do with the job (the key out
  // of credit, a fetch that timed out), and a closed shelf had no buttons.
  const stopped = ["failed", "skipped"].includes(data.status);
  // A fill that started under WORKING_GRACE seconds ago gets no buttons: the
  // agent is working and the only honest thing to show is that. After the
  // grace the restart button comes back, gated behind a confirm.
  const working = fillWorking(data);

  // The two PDFs are the review. Stacked, resume first; the letter falls
  // back to its text when the PDF did not compile.
  // A re-tailor writes a new folder behind the same URLs, and Chrome's PDF
  // viewer keeps showing the render it already has: the page said
  // "Re-tailored" while the old resume sat under it (2026-09-24). The
  // folder name is the version, so the src changes when the documents do.
  const stamp = `?v=${encodeURIComponent(data.folder || "")}`;
  const views = [["resume.pdf", "Resume"], ["resume_changes.pdf", "Changes"],
                 ["resume_both.pdf", "Before and after"]]
    .filter(([file]) => data.artifacts.includes(file));
  const resumeEditor = data.resume_source ? `
    <div class="resume-edit">
      <strong>Edit resume</strong>
      <p class="hint">Highlight wording in the source below, describe the change, then choose a model. Keep the surrounding commands and braces selected when they belong to the wording. Nothing is saved until you press Save new version.</p>
      <textarea class="resume-text" id="resumeEditText" spellcheck="false">${escape(data.resume_source)}</textarea>
      <div class="resume-selection" id="resumeSelection" hidden>
        <span class="quote" id="resumeQuote"></span>
        <textarea id="resumeInstruction" rows="2" placeholder="How should this highlighted resume text change?"></textarea>
        <div class="actions">
          <button class="act model-choice" id="resumeRewriteDefault"
                  data-model="${escape(data.resume_models?.default || "Default model")}">Rewrite · Default</button>
          <button class="act opus model-choice" id="resumeRewriteOpus"
                  data-model="${escape(data.resume_models?.premium || "Opus")}">Rewrite · Opus</button>
        </div>
      </div>
      <div class="actions">
        <button class="act primary" id="resumeSave" disabled>Save new version</button>
        <span class="hint" id="resumeEditNote">Select a passage to rewrite it.</span>
      </div>
    </div>` : "";
  const resumeDoc = data.artifacts.includes("resume.pdf")
    ? `<div><h3>Tailored resume
        ${views.length > 1 ? `<span class="views">${views.map(([file, label], i) =>
          `<button class="view${i ? "" : " on"}" data-file="${file}">${label}</button>`).join("")}</span>` : ""}</h3>
        <div class="resume-workbench">
          <iframe id="resumeView" src="/review/${id}/file/resume.pdf${stamp}#toolbar=0&navpanes=0&view=Fit" title="Tailored resume"></iframe>
          ${resumeEditor}
        </div></div>` : "";
  const selectedBase = data.resume_base?.base || "";
  const resumeRoute = data.resume_bases?.length ? `
    <div class="card resume-manager">
      <div class="resume-route">
        <strong>Starting resume</strong>
        <select id="jobResumeBase">${data.resume_bases.map((row) =>
          `<option value="${escape(row.id)}" ${row.id === selectedBase ? "selected" : ""}
             ${row.active === false ? "disabled" : ""}>${escape(row.label)}${row.active === false ? " · archived" : ""}</option>`
        ).join("")}</select>
        <button class="act" id="jobResumeChange" disabled>Re-tailor from this resume</button>
        <span class="hint" id="jobResumeNote">${escape(data.resume_base?.reason || "")}</span>
      </div>
    </div>` : "";
  const coverEditor = data.cover_letter ? `
    <div class="cover-edit">
      <strong>Edit cover letter</strong>
      <p class="hint">Highlight text below, describe the change, then choose a model. Nothing is saved until you press Save new version.</p>
      <textarea class="letter-text" id="coverEditText" spellcheck="true">${escape(data.cover_letter)}</textarea>
      <div class="cover-selection" id="coverSelection" hidden>
        <span class="quote" id="coverQuote"></span>
        <textarea id="coverInstruction" rows="2" placeholder="How should this highlighted text change?"></textarea>
        <div class="actions">
          <button class="act model-choice" id="coverRewriteDefault"
                  data-model="${escape(data.cover_models?.default || "Default model")}">Rewrite · Default</button>
          <button class="act opus model-choice" id="coverRewriteOpus"
                  data-model="${escape(data.cover_models?.premium || "Opus")}">Rewrite · Opus</button>
        </div>
      </div>
      <div class="actions">
        <button class="act primary" id="coverSave" disabled>Save new version</button>
        <span class="hint" id="coverEditNote">Select a passage to rewrite it.</span>
      </div>
    </div>` : "";
  const letterDoc = data.artifacts.includes("cover_letter.pdf")
    ? `<div><h3>Cover letter</h3>
        <div class="cover-workbench">
          <iframe src="/review/${id}/file/cover_letter.pdf${stamp}#toolbar=0&navpanes=0&view=Fit" title="Cover letter"></iframe>
          ${coverEditor}
        </div></div>`
    : data.cover_letter
      ? `<div><h3>Cover letter</h3><div class="cover-workbench">
          <div class="card prose letter">${letter(data.cover_letter)}</div>${coverEditor}</div></div>`
      : data.cover_letter_error
        ? `<div><h3>Cover letter</h3>
            <div class="card"><pre class="posting">${escape(data.cover_letter_error)}</pre>
            <p class="note">The resume is unaffected. Re-tailor to try the letter again.</p></div></div>`
        : data.artifacts.includes("resume.pdf")
          ? `<div><h3>Cover letter</h3><div class="card"><p class="note">Not written yet: the fill writes it
              when the form has a cover-letter slot.</p>
              <button class="act" id="coverNow">Write it now</button></div></div>`
          : "";
  const outreachDoc = outreachHtml(id, outreach);

  $("detail").innerHTML = `
    ${head(job, data)}
    ${banners(data)}
    ${working ? `
      <div class="actions">
        <span class="state agent">Agent is working</span>
        <span class="hint">Leave the browser alone. Options return in ${working}s.</span>
      </div>` : ""}
    ${!reviewable && !filled && !working ? `
      <div class="actions">
        <span class="state ${TONE[data.status] || ""}">${LABEL[data.status] || data.status}</span>
        ${data.status === "filling"
          ? `<button class="act" id="submitted">I submitted it</button>` : ""}
        ${["approved", "filling", "failed"].includes(data.status)
          ? `<a class="act" href="${escape(job.url)}" target="_blank" rel="noreferrer">Open application</a>
             <button class="act" id="fillAutopilot">Autopilot fill</button>
             <button class="act primary" id="fillJobright">Jobright + check</button>` : ""}
        ${data.status !== "submitted" && data.status !== "filling"
          ? `<button class="act primary" id="submittedManual" title="You applied on the employer's site yourself; it is tracked as submitted">I submitted it myself</button>` : ""}
        ${data.status !== "skipped" && data.status !== "submitted"
          ? `<button class="act danger" id="reject">Reject…</button>` : ""}
        <button class="act danger" id="deleteJob">Delete permanently…</button>
      </div>` : ""}

    ${fitHtml(data.fit)}
    ${bulletsHtml(data.bullet_review)}
    <div id="outcomeSlot"></div>
    <h3>Interview prep</h3><div class="card" id="prepSlot"><button class="act" id="prepGo">Prepare: match my stories to this role</button></div>

    ${resumeDoc || letterDoc ? `
      <div class="actions">
        <button class="act" id="reveal">Show the files in Finder</button>
        <span class="hint" id="revealNote">The resume and the letter under their upload names, selected, ready to drag onto a form.</span>
      </div>
      ${resumeRoute}
      <div class="docs">${resumeDoc}${letterDoc}</div>
      ${outreachDoc}` : ""}

    ${data.suggestions ? `<h3>What changed, and why</h3>
      <div class="card prose">${markdown(rationale(data.suggestions))}</div>` : ""}

    ${data.fill_notes ? `<h3>What the browser did</h3>
      <div class="card prose">${markdown(data.fill_notes)}</div>` : ""}

    ${data.changes && data.changes.length ? `<h3>What you changed on the form</h3>
      <div class="card changes">
        <p class="hint">Since autofill left it. Tick what it got wrong; every next form gets your value on that field. Nothing is remembered without the tick.</p>
        <table class="kv corr">${data.changes.map((c) => `<tr class="${c.remembered ? "kept" : ""}">
          <td><label><input type="checkbox" data-label="${escape(c.label)}" ${c.remembered ? "checked disabled" : ""}> ${escape(c.label)}</label></td>
          <td class="${c.was ? "was" : "empty"}">${escape(c.was || "blank")}</td>
          <td>${escape(c.now)}${c.remembered ? " ✓" : ""}</td></tr>`).join("")}</table>
        <div class="row"><button class="act primary" id="rememberGo" disabled>Remember</button><span class="hint" id="rememberNote"></span></div>
      </div>` : ""}

    ${data.status !== "queued" && data.status !== "tailoring" ? `<h3>${logo()} This job, in one thread</h3>
      <div class="card asker thread">
        <div class="turns" id="threadTurns">${turns(data.thread || [])}</div>
        ${data.questions && data.questions.length ? `<div class="hint">Still empty on the form, tap one:</div>
          <div class="qs">${data.questions.map((q) => `<button class="act small q">${escape(q)}</button>`).join("")}</div>` : ""}
        <textarea id="askQ" placeholder="Ask a question, or describe a document change — 'lead with the agent work', 'make the opening more specific'."></textarea>
        <div class="row"><button class="act primary" id="askGo">Answer it</button>
          <button class="act" id="resumeGo">Regenerate resume</button>
          <button class="act" id="coverGo">Regenerate cover letter</button>
          <button class="act" id="changeGo">Regenerate both</button>
          <button class="act opus" id="opusGo" title="Regenerate both with the expensive model: it rewrites far more of the resume, and costs about eight times as much.">Both with Opus</button>
          <span class="hint" id="askNote">The posting, the tailored resume, the letter, your profile and this thread are already in it.
            Add an instruction or regenerate one document as-is. The job stays where it stands.</span></div>
      </div>` : ""}

    ${data.answers ? `<h3>${logo()} Free-form answers, written by the assistant</h3>
      <div class="card prose">${markdown(data.answers)}</div>` : ""}

    ${data.stories_used && data.stories_used.length ? `<h3>Stories the tailor read</h3>
      <div class="card prose"><p>${data.stories_used.map(escape).join(", ")}</p></div>` : ""}

    ${data.artifacts.includes("fill_screenshot.png") ? `<h3>The filled form</h3>
      <img class="shot" src="/review/${id}/file/fill_screenshot.png"
           alt="The filled application form">` : ""}

    ${data.artifacts.includes("posting.md") ? `
      <details>
        <summary>The job posting as scraped</summary>
        <div class="card"><pre class="posting" id="posting">loading…</pre></div>
      </details>` : ""}

    ${data.log ? `
      <details>
        <summary>Fill log</summary>
        <div class="card"><pre class="posting" id="filllog">loading…</pre></div>
      </details>` : ""}

    ${data.history.length ? `
      <details>
        <summary>History</summary>
        <div class="card prose"><ul>${data.history.map((h) =>
          `<li><strong>${escape(LABEL[h.status] || h.status)}</strong>
           <span class="hint">${escape((h.at || "").replace("T", " ").replace("+00:00", " UTC"))}</span>
           ${h.note ? "<br>" + escape(h.note) : ""}</li>`).join("")}</ul></div>
      </details>` : ""}

    ${reviewable ? `
      <div class="fab">
        <div class="decide">
          <button class="big act" id="approve" title="Approves the documents and fills the form. It stops on the filled form; you press Submit.">Apply</button>
          <button class="small act" id="submittedManual" title="You applied on the employer's site yourself; it is tracked as submitted">I submitted it myself</button>
          <button class="small danger act" id="reject">Reject</button>
          <button class="small danger act" id="deleteJob">Delete…</button>
        </div>
        <div class="ask">
          <textarea id="instruction" rows="1" placeholder="Ask for a change…"></textarea>
          <button class="small act" id="revise">Re-tailor</button>
        </div>
      </div>` : ""}
    ${filled ? `
      <div class="fab">
        <button class="big act" id="showForm" title="Brings the filled form's tab to the front with its Submit button in view">Open the filled form</button>
        <button class="small act" id="submitted">I submitted it</button>
        <button class="small act" id="fillNow">Fill again</button>
        <button class="small danger act" id="reject">Reject</button>
        <button class="small danger act" id="deleteJob">Delete…</button>
      </div>` : ""}
    ${stopped ? `
      <div class="fab">
        <button class="big act" id="retry" title="${data.tailored
          ? "Start the fill again on the documents already here"
          : "Tailor it again from the posting, then back to you at checkpoint 1"}">Try again</button>
      </div>` : ""}
  `;

  // The bar is drawn last in the template; it belongs under the title.
  const bar = $("detail").querySelector(".fab"), title = $("detail").querySelector(".head");
  if (bar && title) title.after(bar);

  if ($("approve")) $("approve").onclick = () => approve(id);
  if ($("reject")) $("reject").onclick = () => openReject(id);
  if ($("deleteJob")) $("deleteJob").onclick = () => deleteJob(id);
  if ($("submitted")) $("submitted").onclick = () => markSubmitted(id);
  if ($("submittedManual")) $("submittedManual").onclick = async () => {
    if (!confirm("Mark this job submitted? Only if you applied on the employer's site yourself.")) return;
    await act(id, () => api(`/review/${id}/submitted`, { method: "POST", body: JSON.stringify({ manual: true }) }));
  };
  if ($("revise")) $("revise").onclick = () => revise(id);
  // The note box: one line until it is touched, then room to write, and
  // the re-tailor button only once there is a note.
  const ask = $("instruction");
  if (ask) {
    const box = ask.parentElement;
    const grow = () => box.classList.toggle("open", document.activeElement === ask || !!ask.value.trim());
    ask.onfocus = grow; ask.onblur = grow; ask.oninput = grow;
  }
  for (const button of document.querySelectorAll(".views .view")) {
    button.onclick = () => {
      document.querySelectorAll(".views .view").forEach((b) => b.classList.toggle("on", b === button));
      $("resumeView").src = `/review/${id}/file/${button.dataset.file}${stamp}#toolbar=0&navpanes=0&view=Fit`;
    };
  }
  if ($("fillNow")) $("fillNow").onclick = () => fillAgain(id, "jobright_check");
  if ($("retry")) $("retry").onclick = () => retry(id, data);
  if ($("showForm")) $("showForm").onclick = async () => {
    try {
      const out = await api(`/review/${id}/show-form`, { method: "POST", body: "{}" });
      $("showForm").textContent = out.button ? `In front: press “${out.button}” there` : "In front: Submit is at the bottom";
    } catch (err) { alert(err.message); }
  };
  wireBullets(id);
  if ($("prepGo")) $("prepGo").onclick = async () => {
    $("prepSlot").innerHTML = `<p class="hint">Matching your stories and reading the posting…</p>`;
    try { $("prepSlot").innerHTML = await prepHtml(id, false); }
    catch (err) { $("prepSlot").innerHTML = `<p class="issue">${escape(err.message || String(err))}</p>`; }
  };
  if (["submitted", "filled", "filling", "approved"].includes(data.status)) outcomeHtml(id).then((html) => {
    if (current === id && $("outcomeSlot")) { $("outcomeSlot").innerHTML = html; wireOutcome(id); }
  });
  if ($("fillAutopilot")) $("fillAutopilot").onclick = () => fillAgain(id, "autopilot");
  if ($("fillJobright")) $("fillJobright").onclick = () => fillAgain(id, "jobright_check");
  if ($("reveal")) wireReveal(id);
  if ($("jobResumeBase")) {
    const select = $("jobResumeBase"), button = $("jobResumeChange"), note = $("jobResumeNote");
    select.onchange = () => { button.disabled = select.value === selectedBase; };
    button.onclick = async () => {
      button.disabled = true; note.textContent = "Re-tailoring both documents from this resume…";
      try {
        await api(`/review/${id}/resume-base`, {
          method: "POST", body: JSON.stringify({ base: select.value }),
        });
        setTimeout(() => { if (current === id) show(id); }, 800);
      } catch (err) { note.textContent = err.message; button.disabled = false; }
    };
  }
  if ($("askGo")) wireThread(id, data);
  if ($("coverNow")) $("coverNow").onclick = () => { const b = $("coverGo"); if (b) { b.scrollIntoView({ block: "center" }); b.click(); } };
  if ($("resumeEditText")) wireResumeEditor(id, data);
  if ($("coverEditText")) wireCoverEditor(id, data);
  if ($("rememberGo")) wireRemember(id);
  wireOutreach(id, outreach);
  if (working) setTimeout(() => { if (current === id) show(id); }, working * 1000 + 200);

  if ($("posting")) {
    fetch(`/review/${id}/file/posting.md`).then((r) => r.text())
      .then((text) => { if ($("posting")) $("posting").textContent = text; });
  }

  if ($("filllog")) {
    fetch(`/review/${id}/log`).then((r) => r.text())
      .then((text) => { if ($("filllog")) $("filllog").textContent = text; });
  }
}

function outreachContactActions(contact) {
  const canJobright = !!contact.linkedin_url;
  return `<div class="actions">
    <button class="act" data-outreach-apollo="${escape(contact.id)}">Apollo email</button>
    <button class="act" data-outreach-jobright="${escape(contact.id)}" ${canJobright ? "" : "disabled"}>Jobright guess</button>
    <button class="act primary" data-outreach-draft="${escape(contact.id)}" ${contact.email ? "" : "disabled"}>Write email</button>
    <button class="act" data-outreach-linkedin="${escape(contact.id)}" title="A connection note to copy into LinkedIn; the app never sends it">LinkedIn note</button>
  </div>`;
}

function outreachSetup(state) {
  const key = state.apollo_configured ? "" : `
    <div class="banner warn wide"><b>Connect Apollo</b>
      <div class="actions"><input type="password" id="outreachApolloKey" placeholder="Apollo API key">
      <button class="act" id="outreachSaveKey">Save key</button></div>
      <span class="hint">Kept only in Autopilot's private .env on this Mac.</span>
    </div>`;
  const gmail = state.mail_configured ? "" : `
    <div class="banner warn wide"><b>Connect Gmail</b>
      <div class="outreach-setup">
        <input type="email" id="outreachGmailUser" placeholder="you@gmail.com">
        <input type="password" id="outreachGmailPass" placeholder="Gmail App Password">
      </div>
      <div class="actions"><button class="act" id="outreachSaveGmail">Save Gmail</button>
        <span class="hint">Use a Google App Password, never your account password.</span></div>
    </div>`;
  const contacts = (state.contacts || []).map((contact) => `
    <div class="outreach-person">
      <label class="pick"><input type="checkbox" data-outreach-pick="${escape(contact.id)}"></label>
      <div>
      <b>${escape(contact.name)}</b> · ${escape(contact.role.replace("_", " "))}
      <span class="hint">${escape(contact.title || "")}</span><br>
      <span>${contact.email ? escape(contact.email) : "No email yet"}</span>
      <span class="source">${escape(contact.source)} · ${escape(contact.verification)}</span>
      ${contact.linkedin_url ? `<br><a href="${escape(contact.linkedin_url)}" target="_blank" rel="noreferrer">LinkedIn ↗</a>` : ""}
      ${contact.reason ? `<br><span class="hint">Why: ${escape(contact.reason)}${contact.confidence ? ` · ${Math.round(contact.confidence * 100)}%` : ""}</span>` : ""}
      ${outreachContactActions(contact)}
      </div>
    </div>`).join("");
  const picks = (state.contacts || []).length ? `
      <div class="wide actions outreach-picks">
        <label><input type="checkbox" id="outreachPickAll"> Select all</label>
        <button class="act primary" id="outreachWriteSelected">Write emails</button>
        <span class="hint">Drafts only. Each send still needs its own approve.</span>
      </div>` : "";
  return `
    <div class="outreach-setup">
      ${key}${gmail}
      <div class="wide actions">
        <label><input type="checkbox" class="outreach-who" value="recruiter" checked> Recruiters</label>
        <label><input type="checkbox" class="outreach-who" value="hiring_manager" checked> Hiring managers</label>
        <label title="Founders, CEO, CTO, CFO, COO, VP or head of engineering, partners"><input type="checkbox" class="outreach-who" value="leadership"> Leadership</label>
        <button class="act primary" id="outreachDiscover" ${state.apollo_configured ? "" : "disabled"}>Find people</button>
        <button class="act" id="outreachLeaders" ${state.apollo_configured ? "" : "disabled"} title="The engineering leaders this role reports into, ranked with reasons">Find this role's leaders</button>
        <span class="hint">${escape(state.lookup_note || "Apollo search spends no email credit; enrichment is requested separately.")}</span>
      </div>
      <select id="outreachRole"><option value="recruiter">Recruiter</option><option value="hiring_manager">Hiring manager</option><option value="leadership">Leadership (founder, CEO, CTO, CFO, partner)</option></select>
      <textarea id="outreachName" rows="1" placeholder="contact name"></textarea>
      <textarea id="outreachTitle" rows="1" placeholder="title (optional)"></textarea>
      <textarea id="outreachEmail" rows="1" placeholder="email (optional)"></textarea>
      <textarea class="wide" id="outreachLinkedIn" rows="1" placeholder="LinkedIn profile URL"></textarea>
      <div class="wide actions"><button class="act" id="outreachAddContact">Add contact</button></div>
      ${picks}
    </div>
    <div class="outreach-contacts">${contacts || `<p class="hint">No contacts yet.</p>`}</div>`;
}

function outreachHtml(id, state) {
  const drafts = state.drafts || [];
  let slide = Number.isInteger(outreachSlide[id]) ? outreachSlide[id] : 0;
  slide = Math.max(0, Math.min(slide, Math.max(0, drafts.length - 1)));
  outreachSlide[id] = slide;
  const draft = drafts[slide];
  let carousel = "";
  if (draft) {
    const contact = (state.contacts || []).find((row) => row.id === draft.contact_id) || {};
    const needsVerify = contact.verification !== "verified";
    const locked = draft.status !== "draft";
    carousel = `<div class="outreach-slide" data-slide="${slide}">
      <div class="outreach-head">
        <div><b>${escape(contact.name || "Unknown contact")}</b>
          <span class="hint"> · ${escape((contact.role || "").replace("_", " "))} · ${escape(contact.title || "")}</span></div>
        <span class="source">${escape(contact.email || "")} · ${escape(contact.source || "")} · ${escape(contact.verification || "")}</span>
      </div>
      <label>Subject</label>
      <textarea class="subject" id="outreachSubject" ${locked ? "disabled" : ""}>${escape(draft.subject)}</textarea>
      <label>Email</label>
      <textarea class="body" id="outreachBody" ${locked ? "disabled" : ""}>${escape(draft.body)}</textarea>
      <div class="actions">
        <label><input type="checkbox" id="outreachAttach" ${draft.attach_resume ? "checked" : ""} ${locked ? "disabled" : ""}> Attach tailored resume</label>
        ${needsVerify ? `<label><input type="checkbox" id="outreachVerify" ${draft.verified_by_user ? "checked" : ""} ${locked ? "disabled" : ""}> I verified this address</label>` : ""}
        ${locked ? `<span class="state ${draft.status === "sent" ? "go" : "stop"}">${escape(draft.status)}</span>`
          : draft.channel === "linkedin" ? `<button class="act" id="outreachSave">Save</button>
             <span class="hint">A LinkedIn note: copy it into the connection request yourself. The app never sends it.</span>`
          : `<button class="act" id="outreachSave">Save</button>
             <button class="act primary" id="outreachSend" ${state.mail_configured ? "" : "disabled"}>Approve and send</button>`}
      </div>
      ${draft.error ? `<div class="banner stop">${escape(draft.error)}</div>` : ""}
      <div class="outreach-nav">
        <button class="act" id="outreachPrev" ${slide === 0 ? "disabled" : ""}>←</button>
        <span>${slide + 1} / ${drafts.length}</span>
        <span class="outreach-dots">${drafts.map((_, index) =>
          `<button class="${index === slide ? "on" : ""}" data-outreach-slide="${index}" aria-label="Email ${index + 1}"></button>`).join("")}</span>
        <button class="act" id="outreachNext" ${slide === drafts.length - 1 ? "disabled" : ""}>→</button>
      </div>
    </div>`;
  }
  return `<h3>Outreach</h3>
    <div class="card outreach">
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      ${!state.mail_configured ? `<div class="banner warn">Gmail SMTP is not configured. Drafting works; sending stays disabled.</div>` : ""}
      ${carousel}
      <details ${drafts.length ? "" : "open"}>
        <summary>${drafts.length ? "Contacts and new email" : "Find contacts"}</summary>
        ${outreachSetup(state)}
      </details>
    </div>`;
}

function wireOutreach(id, state) {
  if (outreachKeyHandler) document.removeEventListener("keydown", outreachKeyHandler);
  const drafts = state.drafts || [];
  const move = (next) => {
    outreachSlide[id] = Math.max(0, Math.min(next, drafts.length - 1));
    show(id);
  };
  $("outreachPrev")?.addEventListener("click", () => move((outreachSlide[id] || 0) - 1));
  $("outreachNext")?.addEventListener("click", () => move((outreachSlide[id] || 0) + 1));
  for (const dot of document.querySelectorAll("[data-outreach-slide]")) {
    dot.onclick = () => move(Number(dot.dataset.outreachSlide));
  }
  outreachKeyHandler = (event) => {
    if (current !== id || !drafts.length || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
    if (event.key === "ArrowLeft") move((outreachSlide[id] || 0) - 1);
    if (event.key === "ArrowRight") move((outreachSlide[id] || 0) + 1);
  };
  document.addEventListener("keydown", outreachKeyHandler);

  const run = async (path, body={}) => {
    try {
      await api(`/review/${id}/outreach${path}`, { method: "POST", body: JSON.stringify(body) });
      await show(id);
    } catch (err) {
      alert(err.message);
    }
  };
  if ($("outreachSaveKey")) $("outreachSaveKey").onclick = () => {
    const key = $("outreachApolloKey").value.trim();
    if (!key) { alert("Paste the Apollo API key first."); return; }
    run("/apollo-key", { key });
  };
  if ($("outreachSaveGmail")) $("outreachSaveGmail").onclick = () => {
    const user = $("outreachGmailUser").value.trim();
    const app_password = $("outreachGmailPass").value.trim();
    if (!user || !app_password) {
      alert("Enter your Gmail address and the 16-character App Password.");
      return;
    }
    run("/gmail", { user, app_password });
  };
  if ($("outreachDiscover")) $("outreachDiscover").onclick = () => {
    const roles = [...document.querySelectorAll(".outreach-who:checked")].map((box) => box.value);
    if (!roles.length) { alert("Tick at least one group of people to find."); return; }
    run("/discover", { per_role: 3, roles });
  };
  if ($("outreachAddContact")) $("outreachAddContact").onclick = () => run("/contact", {
    role: $("outreachRole").value,
    name: $("outreachName").value.trim(),
    title: $("outreachTitle").value.trim(),
    email: $("outreachEmail").value.trim(),
    linkedin_url: $("outreachLinkedIn").value.trim(),
  });
  if ($("outreachLeaders")) $("outreachLeaders").onclick = () => run("/leaders");
  for (const button of document.querySelectorAll("[data-outreach-linkedin]")) {
    button.onclick = () => run("/linkedin", { contact_id: button.dataset.outreachLinkedin });
  }
  for (const button of document.querySelectorAll("[data-outreach-apollo]")) {
    button.onclick = () => run("/apollo", { contact_id: button.dataset.outreachApollo });
  }
  for (const button of document.querySelectorAll("[data-outreach-jobright]")) {
    button.onclick = () => run("/jobright", { contact_id: button.dataset.outreachJobright });
  }
  for (const button of document.querySelectorAll("[data-outreach-draft]")) {
    button.onclick = () => run("/draft", { contact_id: button.dataset.outreachDraft, attach_resume: true });
  }
  if ($("outreachPickAll")) $("outreachPickAll").onchange = () => {
    const on = $("outreachPickAll").checked;
    for (const box of document.querySelectorAll("[data-outreach-pick]")) box.checked = on;
  };
  if ($("outreachWriteSelected")) $("outreachWriteSelected").onclick = async () => {
    const ids = [...document.querySelectorAll("[data-outreach-pick]:checked")]
      .map((box) => box.dataset.outreachPick);
    if (!ids.length) { alert("Select the people you want to email."); return; }
    const needLookup = ids.filter((contactId) => {
      const contact = (state.contacts || []).find((row) => row.id === contactId);
      return contact && !contact.email;
    }).length;
    const message = needLookup
      ? `Write drafts for ${ids.length} people? ${needLookup} need an Apollo lookup (about 1 credit each). Nothing is sent.`
      : `Write drafts for ${ids.length} people? Nothing is sent until you approve each one.`;
    if (!confirm(message)) return;
    try {
      const next = await api(`/review/${id}/outreach/drafts`, {
        method: "POST", body: JSON.stringify({ contact_ids: ids, attach_resume: true }),
      });
      const index = (next.drafts || []).findIndex((row) => row.id === next.active_draft);
      if (index >= 0) outreachSlide[id] = index;
      await show(id);
    } catch (err) { alert(err.message); }
  };
  const currentDraft = drafts[outreachSlide[id] || 0];
  const draftBody = () => ({
    subject: $("outreachSubject").value.trim(),
    body: $("outreachBody").value.trim(),
    attach_resume: $("outreachAttach").checked,
    verified_by_user: $("outreachVerify")?.checked || false,
  });
  if ($("outreachSave") && currentDraft) $("outreachSave").onclick = async () => {
    try {
      await api(`/review/${id}/outreach/draft/${currentDraft.id}`, {
        method: "PATCH", body: JSON.stringify(draftBody()),
      });
      await show(id);
    } catch (err) { alert(err.message); }
  };
  if ($("outreachSend") && currentDraft) $("outreachSend").onclick = async () => {
    const contact = (state.contacts || []).find((row) => row.id === currentDraft.contact_id) || {};
    if (!confirm(`Send this email to ${contact.name || "this contact"} at ${contact.email || "the selected address"}?`)) return;
    const body = draftBody();
    try {
      await api(`/review/${id}/outreach/draft/${currentDraft.id}`, {
        method: "PATCH", body: JSON.stringify(body),
      });
      await api(`/review/${id}/outreach/draft/${currentDraft.id}/send`, {
        method: "POST", body: JSON.stringify({ confirmed: true, verified_by_user: body.verified_by_user }),
      });
      await show(id);
    } catch (err) { alert(err.message); }
  };
}

function head(job, data) {
  return `<div class="head">
      <h2>${job.company ? `${escape(job.company)} — ` : ""}${escape(job.title || "Untitled role")}</h2>
      <a href="${escape(job.url)}" target="_blank" rel="noreferrer">open posting ↗</a>
    </div>`;
}

function banners(data) {
  let html = "";
  if (data.reject_label) {
    html += `<div class="banner stop"><strong>You rejected this: ${escape(data.reject_label)}.</strong>
      ${data.reject_note ? escape(data.reject_note) : ""}</div>`;
  }
  if (data.screen && data.screen.flags && data.screen.flags.length) {
    // The screen ran before tailoring. Terse: one line per flag, in the
    // posting's own words, and it stays a recommendation.
    const cls = data.screen.verdict === "reject" ? "stop" : "warn";
    const lines = data.screen.flags.map((f) =>
      `<li><strong>${escape(f.category.replace("_", " "))}</strong>${f.severity === "soft" ? " (soft)" : ""}:
       “${escape(f.quote)}”${f.reason ? ` — ${escape(f.reason)}` : ""}</li>`).join("");
    const facts = data.screen.facts_source === "resume" ? " Facts derived from the resume, so visa and dates are unknown." : "";
    html += `<div class="banner ${cls}"><strong>Screen: ${escape(data.screen.verdict)}.</strong>
      ${escape(data.screen.summary || "")}${facts}<ul class="flags">${lines}</ul></div>`;
  } else if (data.screen_error) {
    html += `<div class="banner warn"><strong>Screen failed:</strong> ${escape(data.screen_error.split("\n")[0])}</div>`;
  }
  if (data.mismatch) {
    html += `<div class="banner warn"><strong>This looks like a poor fit.</strong>
      ${escape(data.mismatch.replace(/^#.*\n/, "").split("\n\n")[0].trim())}
      <br>Nothing was tailored. It is still your call.</div>`;
  }
  // The folder's error.txt belongs to this attempt; the queue's error field
  // is only current while the job is actually failed.
  const failure = (data.status === "failed" && data.error_detail) || (data.error || "").split("\n")[0];
  if (failure) {
    html += `<div class="banner stop"><strong>Failed:</strong> ${escape(failure)}</div>`;
  }
  if (data.status === "filled") {
    html += `<div class="banner go"><strong>Form filled, nothing submitted.</strong>
      The browser window is still open on the form. Check it there, submit it
      yourself, then mark it below. Close that window when you are done.</div>`;
  }
  if (data.status === "approved" && data.fill) {
    html += `<div class="banner warn"><strong>Approved, fill starting.</strong>
      The browser is opening; leave it alone.</div>`;
  } else if (data.status === "approved") {
    html += `<div class="banner go"><strong>Approved.</strong> Press “Fill the form now”
      when you are ready.</div>`;
  }
  if (data.status === "filling" && data.fill) {
    html += `<div class="banner warn"><strong>Filling the form.</strong>
      The agent is working in the browser window; leave it alone.</div>`;
  } else if (data.status === "filling") {
    html += `<div class="banner stop"><strong>The fill died.</strong>
      Nothing is filling this form any more. Press “Restart the fill”.</div>`;
  }
  return html;
}

// Seconds a fresh fill is shown as "working" with no buttons.
const WORKING_GRACE = 30;

// Seconds left in the grace period, or 0 when buttons should show. A fill
// this server did not start has no start time and gets no grace.
function fillWorking(data) {
  if (!data.fill || data.fill.age == null) return 0;
  return Math.max(0, WORKING_GRACE - data.fill.age);
}

// Gate one: the server refuses while a fill runs. Gate two: the human
// confirms, and only then is the running fill killed and a new one started.
// The question box: one answer per press, shown with a copy button and
// kept in answers.md. Nothing here touches the form; the human types it.
// The pick list of what the human changed on the form: only ticked rows
// go on file, and the card is redrawn from the server's answer.
function wireRemember(id) {
  const boxes = [...$("detail").querySelectorAll(".changes input[type=checkbox]:not(:disabled)")];
  const sync = () => { $("rememberGo").disabled = !boxes.some((b) => b.checked); };
  for (const b of boxes) b.onchange = sync;
  $("rememberGo").onclick = async () => {
    const labels = boxes.filter((b) => b.checked).map((b) => b.dataset.label);
    $("rememberGo").disabled = true;
    try {
      const r = await api(`/review/${id}/remember`, { method: "POST", body: JSON.stringify({ labels }) });
      $("rememberNote").textContent = r.remembered ? `Remembered ${r.remembered}.` : (r.reason || "Nothing remembered");
      setTimeout(() => { if (current === id) show(id); }, 800);
    } catch (err) { $("rememberNote").textContent = err.message; sync(); }
  };
}

// One thread per job: a message is either a question, answered from
// everything this application has, or a change, which re-tailors into new
// documents and leaves the job's standing alone.
function turns(list) {
  if (!list.length) return `<p class="hint">Nothing asked yet. A screener question you cannot see the assistant on,
    or a change to the resume — both live here, with the posting and your profile already in the context.</p>`;
  return list.map((turn) => {
    const mine = turn.kind === "question" || turn.kind === "change";
    const bad = turn.kind === "error" || turn.state === "error";
    const running = turn.state === "running";
    const target = turn.target === "resume" ? "resume"
      : turn.target === "cover" ? "cover letter" : "resume and cover letter";
    const who = turn.kind === "change" ? `You, regenerating the ${target}`
      : turn.kind === "question" ? "You"
      : turn.kind === "result" ? (running ? `Regenerating ${target}…` : `Regenerated ${target}`)
      : bad ? "Failed" : "Autopilot";
    const body = running ? `The ${target} ${turn.target === "both" || !turn.target ? "are" : "is"} being written again. This takes a minute or two.`
      : (turn.text || "");
    return `<div class="turn ${mine ? "you" : "bot"}${bad ? " bad" : ""}${running ? " run" : ""}">
      <div class="who">${escape(who)}${turn.model ? ` · ${escape(turn.model)}` : ""}</div>
      <div class="a">${escape(body)}</div>
      ${!mine && !running && !bad && turn.text ? `<button class="act small copy">Copy</button>` : ""}
    </div>`;
  }).join("");
}

function paintTurns(list) {
  const box = $("threadTurns");
  if (!box) return;
  box.innerHTML = turns(list);
  const answers = list.filter((turn) => turn.kind === "answer" || (turn.kind === "result" && turn.state !== "running"));
  [...box.querySelectorAll(".copy")].forEach((button, i) => {
    button.onclick = async () => {
      try { await navigator.clipboard.writeText(answers[i]?.text || ""); button.textContent = "Copied"; }
      catch { button.textContent = "Select and copy"; }
    };
  });
  box.scrollTop = box.scrollHeight;
}

function wireThread(id, data) {
  const box = $("askQ"), go = $("askGo"), change = $("changeGo"), note = $("askNote");
  const resume = $("resumeGo"), cover = $("coverGo"), opus = $("opusGo");
  let changing = !!data.thread_running;
  for (const b of document.querySelectorAll(".asker .q")) b.onclick = () => { box.value = b.textContent; box.focus(); armed(); };
  // A change runs in a thread on the server; the page watches the turn
  // until it is done and then re-reads the job, whose folder has changed.
  async function poll(jobId) {
    if (current !== jobId) return;
    try {
      const r = await api(`/review/${jobId}/thread`);
      paintTurns(r.turns || []);
      if (r.running) return setTimeout(() => poll(jobId), 3000);
      if (current === jobId) show(jobId);
    } catch { /* the next render picks it up */ }
  }

  paintTurns(data.thread || []);
  if (data.thread_running) poll(id);

  // "Re-tailor with Opus" with nothing typed is a request in itself: run
  // the job again on the stronger model. The other two need words.
  const OPUS_ONLY = "Re-tailor this on the stronger model. No new instruction: same posting, same profile, same rules.";

  const DEFAULT = {
    resume: "Regenerate the resume from the same posting, profile, and rules. No additional changes requested.",
    cover: "Regenerate the cover letter from the same posting, resume, profile, and rules. No additional changes requested.",
  };
  const send = async (action, premium = false) => {
    if (changing) return;
    const typed = box.value.trim();
    const text = typed || (premium ? OPUS_ONLY : DEFAULT[action] || "");
    if (!text) return;
    const target = action === "resume" ? "the resume"
      : action === "cover" ? "the cover letter" : "both documents";
    if (action !== "ask" && !confirm(`Regenerate ${target}${premium ? " on Opus" : ""}?\n\n` + text)) return;
    if (action !== "ask") changing = true;
    go.disabled = change.disabled = resume.disabled = cover.disabled = true;
    if (opus) opus.disabled = true;
    note.textContent = action === "ask" ? "Writing…"
      : premium ? "Regenerating both on Opus…" : `Regenerating ${target}…`;
    try {
      const r = await api(`/review/${id}/thread`, { method: "POST", body: JSON.stringify({ text, action, premium }) });
      box.value = "";
      paintTurns(r.turns || []);
      note.textContent = action === "ask" ? "Kept on file."
        : `Regenerating ${target}; the document above changes when it lands.`;
      if (r.running) poll(id);
    } catch (err) {
      if (action !== "ask") changing = false;
      note.textContent = err.message || "Failed";
    } finally { armed(); }
  };

  go.onclick = () => send("ask");
  resume.onclick = () => send("resume");
  cover.onclick = () => send("cover");
  change.onclick = () => send("change");
  if (opus) opus.onclick = () => send("change", true);
  box.onkeydown = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") send("ask"); };
  // An empty box used to swallow the click: `send` returned before saying
  // anything, so pressing Re-tailor with nothing typed looked like a dead
  // button (three times, 2026-09-24). The buttons now say so themselves.
  const armed = () => {
    const empty = !box.value.trim();
    go.disabled = changing || empty;
    change.disabled = changing || empty;
    resume.disabled = cover.disabled = changing;
    go.title = change.title = empty ? "Say what to change or ask first" : "";
    resume.title = empty ? "Regenerate the resume with the same inputs and rules" : "Regenerate only the resume with this instruction";
    cover.title = empty ? "Regenerate the cover letter with the same inputs and rules" : "Regenerate only the cover letter with this instruction";
    if (opus) {
      opus.disabled = changing;
      opus.title = empty
        ? "Run this job again on the stronger model, with no new instruction"
        : "Re-tailor with the stronger model and this instruction";
    }
  };
  box.addEventListener("input", armed);
  armed();
}

function wireCoverEditor(id, data) {
  const area = $("coverEditText"), panel = $("coverSelection"), quote = $("coverQuote");
  const instruction = $("coverInstruction"), note = $("coverEditNote"), save = $("coverSave");
  const normal = $("coverRewriteDefault"), opus = $("coverRewriteOpus");
  let selection = null;
  let busy = false;

  const capture = () => {
    if (busy) return;
    const start = area.selectionStart, end = area.selectionEnd;
    if (end <= start) return;
    selection = { start, end };
    quote.textContent = area.value.slice(start, end);
    panel.hidden = false;
    note.textContent = "Describe the change, then choose Default or Opus.";
  };
  area.addEventListener("select", capture);
  area.addEventListener("mouseup", capture);
  area.addEventListener("keyup", capture);
  area.addEventListener("input", () => {
    save.disabled = area.value === data.cover_letter;
  });

  const rewrite = async (premium) => {
    const request = instruction.value.trim();
    if (!selection) { note.textContent = "Highlight the text to rewrite."; area.focus(); return; }
    if (!request) { note.textContent = "Say how the highlighted text should change."; instruction.focus(); return; }
    const before = area.value;
    const selected = before.slice(selection.start, selection.end);
    busy = true;
    normal.disabled = opus.disabled = true;
    note.textContent = premium ? "Opus is rewriting the selection…" : "Rewriting the selection…";
    try {
      const result = await api(`/review/${id}/cover/rewrite`, {
        method: "POST",
        body: JSON.stringify({ selected, instruction: request, premium }),
      });
      if (area.value !== before) throw new Error("The letter changed while the rewrite was running. Try again.");
      area.value = before.slice(0, selection.start) + result.replacement + before.slice(selection.end);
      const end = selection.start + result.replacement.length;
      area.focus();
      area.setSelectionRange(selection.start, end);
      selection.end = end;
      quote.textContent = result.replacement;
      save.disabled = false;
      note.textContent = `Rewritten with ${result.model}. Review it, then save the new version.`;
    } catch (err) {
      note.textContent = err.message || "Rewrite failed";
    } finally {
      busy = false;
      normal.disabled = opus.disabled = false;
    }
  };
  normal.onclick = () => rewrite(false);
  opus.onclick = () => rewrite(true);

  save.onclick = async () => {
    if (save.disabled || busy) return;
    busy = true;
    save.disabled = true;
    note.textContent = "Compiling the new cover letter…";
    try {
      await api(`/review/${id}/cover/save`, {
        method: "POST",
        body: JSON.stringify({ expected: data.cover_letter, text: area.value }),
      });
      await show(id);
    } catch (err) {
      note.textContent = err.message || "Save failed";
      save.disabled = false;
    } finally {
      busy = false;
    }
  };
}

// Start a stopped job again; the server picks the step (documents there means
// the fill, none means the tailor). Lifting a rejection is asked first.
async function retry(id, data) {
  if (data && data.status === "skipped") {
    const why = data.reject_note || data.reject_reason || "no reason recorded";
    if (!confirm(`You rejected this job (${why}).\n\nTrying again lifts that and starts it over. Continue?`)) return;
  }
  await act(id, () => api(`/review/${id}/retry`, { method: "POST", body: "{}" }));
}

async function fillAgain(id, mode) {
  await act(id, async () => {
    try {
      await api(`/review/${id}/fill`, {
        method: "POST", body: JSON.stringify({ mode }),
      });
      return;
    } catch (err) {
      if (err.detail?.error !== "fill_running") throw err;
      const ok = confirm("A fill is already running for this job.\n" +
        "This will kill the current job and restart. Are you sure you want to continue?");
      if (!ok) return;

    await api(`/review/${id}/fill`, {
      method: "POST", body: JSON.stringify({ force: true, mode }),

  });

// The letter is plain paragraphs; line breaks inside one (the sign-off) stay.
function letter(text) {
  return escape(text.trim()).split(/\n{2,}/)
    .map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

// The rationale file starts with a title and a model line for the archive.
// The page has its own heading, and the model is nobody's business here.
function rationale(text) {
  return text.replace(/^# .*\n/, "").replace(/^_Model:.*_\s*$/m, "").trim();
}

// Just enough markdown for the rationale blocks: headings, bullets, bold.
function markdown(text) {
  return escape(text)
    .replace(/^#+\s*(.+)$/gm, "<h4>$1</h4>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^[-*]\s+(.+)$/gm, "<li>$1</li>")
    .replace(/(?:<li>.*<\/li>\n?)+/g, (match) => `<ul>${match}</ul>`)
    .replace(/\n{2,}/g, "<p>");
}

// The assistant's logo, small and still: the orb at rest (see Bubble),
// the same mark the fill leaves in front of every field it set.
function logo() {
  return `<svg class="logo" viewBox="-70 -70 140 140" width="16" height="16" aria-hidden="true">
    <circle r="50" cx="7" cy="7" fill="var(--ink)"/><circle r="50" fill="var(--bg)" stroke="var(--ink)" stroke-width="7"/>
    <circle r="14" fill="var(--purple)"/></svg>`;
}

function escape(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Spend counter: today and the week from Autopilot's own ledger, the balance
// from OpenRouter's account read (free). The server reads the balance at most
// every five minutes; a click forces a fresh read.
const money = (n) => "$" + (n < 10 ? n.toFixed(2) : n.toFixed(1));
let spendAt = 0;
async function loadSpend(fresh = false) {
  const el = $("spend");
  try {
    const out = await api("/system/credits" + (fresh ? "?fresh=1" : ""));
    const or = out.openrouter || {};
    const left = or.ok && or.left != null
      ? `<b class="left">${money(or.left)}</b> left`
      : `<span class="bad">${or.error || "balance unknown"}</span>`;
    el.innerHTML = `<b>${money(out.today)}</b> today · ${money(out.week)} 7d · ${left}`;
    el.classList.toggle("low", !!(or.ok && or.left != null && or.left < 2));
    const parts = Object.entries(out.by_provider || {}).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => `${k.replace("openrouter:", "")}: ${money(v)}`);
    el.title = ["Last 7 days by model:", ...parts,
      or.ok ? `OpenRouter lifetime used ${money(or.used || 0)}` : "",
      "Click to re-read the balance"].filter(Boolean).join("\n");
    el.hidden = false;
  } catch (_) { el.hidden = true; }
  spendAt = Date.now();
}
$("spend").onclick = () => loadSpend(true);

// Refresh while a pipeline run is in flight, but never while a dialog is open
// or the page is hidden, so a decision in progress is not interrupted.
function pollNow() {
  if (document.hidden || $("rejectDialog").open || $("reportDialog").open) return;
  if (view === "jobs") { loadList(); loadProfileStat(); }
  else if (view === "profile") Profile.poll();
  else if (view === "scout") Scout.poll();
  else if (view === "resumes") Resumes.poll();
  else if (view === "prompts") Prompts.poll();
  else if (view === "insights") Insights.poll();
  else if (view === "skills") { /* read on open; it is rebuilt from the roles */ }
  else Projects.poll();
  loadScoutBroken();
  if (Date.now() - spendAt > 60000) loadSpend();
  Setup.poll();
}
setInterval(pollNow, 5000);
// The tab is hidden while the person is on the form; a submission is
// marked meanwhile. Coming back must show it at once, not on the next tick.
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollNow(); });


// ---------------------------------------------------------------- Scout --
// Companies' own careers pages watched on a schedule. Two kinds: a
// "notify" watch (a referral is possible there) lists and mails its hits
// for the person to ask; every other watch sends its hits into autopilot
// when the screen does not reject them. Two views at the top, one per
// kind; a watch whose page cannot be read is BROKEN in red.
const Scout = (() => {
  let state = null;     // GET /scout
  let viewing = "jobs";     // "jobs" (the opening view), "referrals", "sources", else a watch id opened from Sources
  let busy = false;

  async function open() { await refresh(); render(); }

  async function refresh() {
    try { state = await api("/scout"); } catch (err) { state = { error: err.message, watches: [], hits: [], mail: {} }; }
  }

  async function poll() {
    if (busy || view !== "scout") return;
    await refresh();
    renderNav();
    // Hits and fits arrive at any time; redraw only when something moved, and
    // never under the person's cursor in the search box.
    const shown = $("detail").dataset.hits;
    const sig = (state.watches || []).filter((w) => w.own_tab).map((w) => allJobs(w.id).map((j) => j.band).join("")).join("|")
      + allJobs().map((j) => j.band).join("");
    const moved = (shown !== undefined && shown !== String(state.hits.length)) || $("detail").dataset.sig !== sig;
    $("detail").dataset.sig = sig;
    if (moved && document.activeElement?.id !== "jobSearch") render();
  }

  function fmt(iso) {
    if (!iso) return "never";
    if (iso === "now") return "now";
    const d = new Date(iso); const mins = Math.round((d - Date.now()) / 60000);
    if (Math.abs(mins) < 60) return mins <= 0 ? `${-mins} min ago` : `in ${mins} min`;
    const h = Math.round(mins / 60);
    if (Math.abs(h) >= 48) { const d = Math.round(h / 24); return d <= 0 ? `${-d} days ago` : `in ${d} days`; }
    return h <= 0 ? `${-h} h ago` : `in ${h} h`;
  }

  function tone(w) { return w.broken ? "stop" : !w.enabled ? "done" : "agent"; }

  // One list of jobs from every source, merged and ranked by fit; the source
  // is a label on the job, not a page of its own (2026-10-22: "just show me the
  // best-fit jobs"). The websites themselves live under Sources.
  const BANDS = [["best", "Best fit"], ["stretch", "Stretch"], ["checking", "Checking"], ["poor", "Not a fit"], ["all", "All"]];
  let band = (() => { try { return localStorage.getItem("scoutBand") || "best"; } catch (_) { return "best"; } })();
  let search = "";

  function bandOf(fit) {
    const v = (fit && fit.verdict) || "";
    return v === "qualified" ? "best" : v === "stretch" ? "stretch" : v === "" ? "checking" : "poor";
  }

  function sourceLabel(w) {
    if (w.args && w.args.curated) return "AI startups";
    if (["lennys", "a16z", "yc", "simplify", "jobright"].includes(w.provider)) return w.company;
    return `${w.provider} board`;
  }

  // Every listed role once: the same job on Lenny's and on the company's own
  // board is one row with both sources on it.
  function allJobs(only) {
    // A paused watch's roles leave the list with it (startups only, 2026-10-24).
    const keep = (w) => only ? w.id === only : !w.own_tab && w.enabled;
    const queued = new Set((state.hits || []).filter((h) => h.status === "queued").map((h) => `${h.watch_id}|${h.posting.id}`));
    const merged = new Map();
    for (const w of (state.watches || []).filter(keep)) {
      for (const r of w.listed || []) {
        if (r.in_autopilot) continue;            // it lives under Applied now
        if (r.age_days != null && r.age_days > 7) continue;   // older than a week: not worth applying (2026-10-23)
        const company = r.company || w.company;
        const key = `${company}|${r.title}`.toLowerCase().replace(/[^a-z0-9|]+/g, " ").trim();
        const row = merged.get(key) || { ...r, company, sources: [], adds: [], queued: false, notes: [] };
        row.sources.push(sourceLabel(w));
        if (r.note) row.notes.push(r.note);
        if (r.age_days != null && (row.age_days == null || r.age_days < row.age_days)) row.age_days = r.age_days;
        row.adds.push({ watch: w.id, id: r.id });
        row.queued = row.queued || queued.has(`${w.id}|${r.id}`);
        if (!row.fit && r.fit) row.fit = r.fit;
        if ((r.posted || "") > (row.posted || "")) row.posted = r.posted;
        merged.set(key, row);
      }
    }
    // A role that shows up more than once is flagged, never hidden: the same
    // job on several lists, or a near twin (same company, same title once
    // levels, years and brackets are taken off).
    const twin = (r) => `${r.company}|${r.title}`.toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]|\b(i{1,3}|iv|\d{4}|new grad|early career|remote|us)\b/g, "")
      .replace(/[^a-z0-9|]+/g, " ").trim();
    const rows = [...merged.values()];
    const twins = rows.reduce((m, r) => m.set(twin(r), (m.get(twin(r)) || 0) + 1), new Map());
    return rows.map((r) => ({ ...r, sources: [...new Set(r.sources)], notes: [...new Set(r.notes)], band: bandOf(r.fit),
      repeated: new Set(r.sources).size > 1 || r.adds.length > 1, twin: twins.get(twin(r)) > 1 }));
  }

  function renderNav() {
    const ws = state?.watches || [];
    const jobs = state ? allJobs() : [];
    const best = jobs.filter((j) => j.band === "best").length;
    const toAsk = (state?.hits || []).filter((h) => h.notify && h.status === "new").length;
    const broken = ws.filter((w) => w.broken).length;
    $("count").textContent = ws.length ? `${best} best fits · ${jobs.length} open roles` : "";
    const row = (key, label, cov, tone) => `<button class="row" data-view="${key}" data-tone="${tone}"
        aria-current="${viewing === key || (key === "sources" && viewing && !["jobs", "referrals", "applied"].includes(viewing) && !String(viewing).startsWith("tab:"))}">
        <span class="role">${label}</span><span class="cov">${cov}</span></button>`;
    const tabs = ws.filter((w) => w.own_tab).map((w) => {
      const own = allJobs(w.id);
      return row(`tab:${w.id}`, escape(w.company), `${own.filter((j) => j.band === "best").length} best fits of ${own.length}`, w.broken ? "stop" : "agent");
    }).join("");
    const added = (state.watches || []).reduce((n, w) => n + (w.listed || []).filter((r) => r.in_autopilot).length, 0);
    $("list").innerHTML = row("jobs", "Jobs", `${best} best fits of ${jobs.length}`, "agent") + tabs
      + row("applied", "Applied", tracked ? `${tracked.applied.length} applied · ${tracked.in_autopilot.length} in autopilot` : `${added} from Scout in autopilot`, "you")
      + row("referrals", "Referrals", `${toAsk} to ask`, "you")
      + row("sources", "Sources", `${ws.length} websites${broken ? ` · <span class="broken">${broken} broken</span>` : ""}`, broken ? "stop" : "done");
    for (const b of $("list").querySelectorAll("button[data-view]")) b.onclick = () => { viewing = b.dataset.view; render(); };
  }

  function render() {
    renderNav();
    if (!state) return;
    const tab = viewing.startsWith && viewing.startsWith("tab:") && state.watches.find((x) => `tab:${x.id}` === viewing && x.own_tab);
    const w = !tab && !["jobs", "referrals", "sources", "applied"].includes(viewing) && state.watches.find((x) => x.id === viewing);
    if (!tab && !w && !["jobs", "referrals", "sources", "applied"].includes(viewing)) viewing = "jobs";
    $("detail").dataset.hits = state.hits.length;
    if (tab) { $("detail").innerHTML = renderJobs(tab); wire(null); return; }
    if (viewing === "applied") { renderTracker(); return; }
    if (viewing === "jobs") $("detail").innerHTML = renderJobs();
    else if (viewing === "referrals") $("detail").innerHTML = renderHits(null, true);
    else if (viewing === "sources") $("detail").innerHTML = renderSources();
    else $("detail").innerHTML = `<p><button class="act small" id="backSources">← All sources</button></p>` + renderWatch(w) + renderListed(w) + renderHits(w, w.notify);
    wire(viewing === "jobs" || viewing === "referrals" || viewing === "sources" ? null : w);
  }

  function renderJobs(tab) {
    const jobs = allJobs(tab && tab.id);
    const counts = Object.fromEntries(BANDS.map(([k]) => [k, k === "all" ? jobs.length : jobs.filter((j) => j.band === k).length]));
    const needle = search.toLowerCase();
    // Today to three days old first, then the rest of the week, then roles
    // with no readable date; decreasing fit inside each.
    const tier = (j) => j.age_days == null ? 2 : j.age_days <= 3 ? 0 : 1;
    const shown = byFit(jobs.filter((j) => (band === "all" || j.band === band)
      && (!needle || `${j.title} ${j.company} ${j.location || ""} ${j.sources.join(" ")}`.toLowerCase().includes(needle))),
      (j) => j.fit, (j) => j.posted).sort((a, b) => tier(a) - tier(b));
    const when = (p) => String(p || "").replace(/^posted\s+/i, "");
    const card = (j) => `
      <div class="hit job ${j.queued ? "done" : ""}">
        <div class="t"><a href="${escape(j.url)}" target="_blank" rel="noopener">${escape(j.title)}</a>
          <span class="company">${escape(j.company)}</span></div>
        <div class="m">${escape(j.location || "")} · <span class="age ${j.age_days != null && j.age_days <= 3 ? "fresh" : ""}">${j.age_days == null ? "date unknown" : j.age_days === 0 ? "today" : j.age_days === 1 ? "yesterday" : `${j.age_days} days ago`}</span>
          ${j.repeated ? `<span class="src-chip rep" title="Listed by more than one source">repeated</span>` : ""}${j.twin ? `<span class="src-chip rep" title="Another listing with nearly the same title at this company">possible repeat</span>` : ""}
          ${j.notes.map((n) => `<span class="src-chip">${escape(n)}</span>`).join("")}
          ${j.sources.map((x) => `<span class="src-chip">${escape(x)}</span>`).join("")}
          ${j.freshness && j.freshness.label !== "open" && j.freshness.label !== "fresh" ? `<span class="src-chip" title="${escape((j.freshness.evidence || []).join("; "))}">${escape(j.freshness.label.replace("_", " "))}</span>` : ""}
</div>
        <div>${fitBlock(j.fit)}</div>
        <div class="go">${j.queued ? `<span class="hint">in autopilot</span>`
          : /jobright\.ai/.test(j.url) ? `<a class="act small primary" href="${escape(j.url)}" target="_blank" rel="noopener" title="Opens on Jobright; the banner screens it and its Apply queues the employer's form">Open on Jobright</a>`
          : `<button class="act small primary" data-add-any="${escape(JSON.stringify(j.adds[0]))}">Add</button>`}</div>
      </div>`;
    const LIMIT = 200;
    return `<div class="head"><h2>${tab ? escape(tab.company) : "Jobs"}</h2><span class="state agent">${counts.best} best fits</span>
        ${tab ? `<span class="hint">· read every ${tab.every_days ? `${tab.every_days} days` : `${tab.checks_per_day_effective}× a day`} · next ${escape(fmt(tab.next_check))}</span>` : ""}</div>
      <div class="bands">${BANDS.map(([k, label]) => `<button class="band ${band === k ? "on" : ""}" data-band="${k}">${label} <b>${counts[k]}</b></button>`).join("")}
        <input type="search" id="jobSearch" placeholder="Filter by title, company, place or source" value="${escape(search)}"></div>
      ${state.watches.some((x) => x.broken) ? `<p class="hint"><span class="broken">Broken</span> ${state.watches.filter((x) => x.broken).map((x) => escape(x.company)).join(", ")} could not be read; see Sources.</p>` : ""}
      <div class="card">${shown.slice(0, LIMIT).map(card).join("") ||
        `<p class="empty" style="padding:1rem">${band === "best" ? "No qualified role right now. Stretch roles are one tab over; fits are worked out in the background as roles come in." : "Nothing here."}</p>`}</div>
      ${shown.length > LIMIT ? `<p class="hint">Showing ${LIMIT} of ${shown.length}; filter to narrow.</p>` : ""}`;
  }

  // Every website Scout reads, one line each; a click opens its settings.
  // The tracker (career/tracker.py): every job put into Autopilot, when the
  // role was posted, found and applied to, where it stands, and the outreach
  // the reply watcher keeps current.
  let tracked = null;
  const OUT = { in_flight: "waiting", quiet: "no reply yet (30+ days)", in_progress: "in process", rejected: "rejected",
                offer_accepted: "offer accepted", offer_declined: "offer declined", withdrawn: "withdrawn",
                no_response: "no response", not_applied: "not applied", unknown: "unknown" };
  async function renderTracker() {
    try { tracked = await api("/career/tracker"); } catch (err) { $("detail").innerHTML = `<p class="issue">${escape(err.message)}</p>`; return; }
    renderNav();
    const mail = (o) => !o || !(o.sent || o.replies) ? `<span class="hint">–</span>`
      : `${o.sent} sent${o.followups_sent ? ` (${o.followups_sent} follow-up)` : ""}${o.replies ? ` · <b>${o.replies} repl${o.replies > 1 ? "ies" : "y"}</b> ${escape(o.reply_verdict || "")}` : ""}${o.followup_due ? ` · <span style="color:var(--warn,#b8860b)">follow-up due</span>` : ""}`;
    const row = (r, applied) => `<tr data-job="${escape(r.id)}">
        <td><b>${escape(r.title)}</b><br><span class="hint">${escape(r.company)}</span></td>
        <td>${escape(r.location || "–")}</td>
        <td>${escape(r.posted || "–")}<br><span class="hint">found ${escape(r.found)}</span></td>
        ${applied ? `<td>${escape(r.applied)}<br><span class="hint">${escape(r.applied_how.startsWith("the app saw") ? "confirmation seen" : "by you")}</span></td>` : `<td>${escape(r.status.replace("_", " "))}</td>`}
        <td>${escape(OUT[r.outcome] || r.outcome)}${r.stage !== "applied" && r.stage !== "prepared" && r.stage !== "discovered" ? ` <span class="hint">· reached ${escape(r.stage)}</span>` : ""}
          ${r.last_event && applied ? `<br><span class="hint">last: ${escape(r.last_event.event)} ${escape(r.last_event.at)}</span>` : ""}</td>
        <td>${mail(r.outreach)}</td></tr>`;
    const head = (applied) => `<tr class="th"><td>Job</td><td>Location</td><td>Posted</td><td>${applied ? "Applied" : "Now"}</td><td>Where it stands</td><td>Outreach</td></tr>`;
    const live = tracked.in_autopilot.filter((r) => !["skipped", "failed"].includes(r.status));
    const closed = tracked.in_autopilot.filter((r) => ["skipped", "failed"].includes(r.status));
    $("detail").innerHTML = `<div class="head"><h2>Applied</h2><span class="state you">${tracked.applied.length} applied</span></div>
      <p class="hint">Every job you put into Autopilot. Outcomes come from what you record on a job, rejections confirmed from mail and replies the watcher reads; outreach is kept current by the reply watcher, which also drafts a follow-up two days after a quiet email. Click a row to open the job.</p>
      <div class="card"><table class="kv tracker">${head(true)}${tracked.applied.map((r) => row(r, true)).join("")}</table></div>
      ${live.length ? `<h3>In autopilot, not applied yet · ${live.length}</h3><div class="card"><table class="kv tracker">${head(false)}${live.map((r) => row(r, false)).join("")}</table></div>` : ""}
      ${closed.length ? `<details><summary>Rejected or failed · ${closed.length}</summary><div class="card"><table class="kv tracker">${head(false)}${closed.map((r) => row(r, false)).join("")}</table></div></details>` : ""}`;
    for (const tr of $("detail").querySelectorAll("tr[data-job]")) tr.onclick = () => { location.hash = tr.dataset.job; switchView("jobs"); };
  }

  function renderSources() {
    const ws = [...(state.watches || [])].sort((a, b) => (b.broken - a.broken) || (b.last_matching - a.last_matching));
    const kind = (w) => w.notify ? "referral" : w.args && w.args.hold ? "list only" : "autopilot";
    // The add form and the schedule are what renderTop draws; here they fold
    // away under the list of websites, which is what the view is for.
    const top = renderTop(false);
    const at = top.indexOf('<div class="card" style="padding:.6rem 1rem">');
    const sched = top.indexOf("<h3>Schedule and mail</h3>");
    const banners = top.slice(top.indexOf("</p>") + 4, at);
    const form = top.slice(at, sched);
    const schedule = top.slice(sched + "<h3>Schedule and mail</h3>".length);
    return `<div class="head"><h2>Sources</h2><span class="state agent">${ws.length} websites</span></div>
      <p class="hint">Where the jobs come from, read ${state.checks_per_day} times a day. Click one to change its search text, kind, title rules or schedule.</p>
      ${banners}
      <div class="card"><table class="kv srcs">${ws.map((w) => `<tr data-watch="${w.id}">
          <td><b>${escape(w.company)}</b> <span class="hint">${escape(sourceLabel(w))}</span></td>
          <td>${w.broken ? '<span class="broken">Broken</span>' : !w.enabled ? "paused" : `${w.last_matching} at your level of ${w.last_total}`}</td>
          <td class="hint">${escape(kind(w))}${w.every_days ? ` · every ${w.every_days} days` : ""}${w.own_tab ? " · own tab" : ""} · next ${escape(fmt(w.next_check))}</td></tr>`).join("")}</table></div>
      <details class="wsettings"><summary>Add a website</summary>${form}</details>
      <details class="wsettings"><summary>Schedule and mail</summary>${schedule}</details>`;
  }


  function renderTop(notify) {
    const m = state.mail || {};
    const intro = notify
      ? `<div class="head"><h2>Notifications</h2></div>
      <p>Companies where you can get a referral. Their pages are read ${state.checks_per_day} times a day; every new role at
      your level is screened, listed here and mailed to you with the link and a note ready for the person who can refer
      you. Nothing here is applied to by itself: you ask, then add it when you want the fill.</p>`
      : `<div class="head"><h2>Autopilot</h2></div>
      <p>Companies you apply to directly. Their pages are read ${state.checks_per_day} times a day; every new role at
      your level is screened and, unless the screen rejects it, goes straight into autopilot: tailored, filled, waiting
      for your Submit. A reject or a screen that could not run waits here for you.</p>`;
    return intro + `
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      ${state.watches.some((x) => x.broken) ? `<div class="banner stop" style="font-size:15px"><span class="broken">Broken</span>
        <b>This company does not work: ${state.watches.filter((x) => x.broken).map((x) => escape(x.company)).join(", ")}.</b>
        The page could not be read; nothing there is watched until it reads again. Open it in the list, press Verify, or paste its new URL.</div>` : ""}
      <div class="card" style="padding:.6rem 1rem">
        <div class="scout-form">
          <textarea id="sCompany" rows="1" placeholder="company, e.g. Google"></textarea>
          <textarea id="sUrl" class="wide" rows="1" placeholder="its careers page, e.g. https://www.google.com/about/careers/applications/jobs/results?q=software+engineer&location=United+States"></textarea>
          <label class="wide hint"><input type="checkbox" id="sNotify" ${notify ? "checked" : ""}> Notify only: I can get a referral here, so do not apply by itself</label>
          <textarea id="sRef" class="wide" rows="1" placeholder="who can refer you there, e.g. Priya (WhatsApp)" ${notify ? "" : "hidden"}></textarea>
        </div>
        <div class="actions">
          <button class="act primary" id="sAdd">Watch it</button>
          <span class="hint" id="sNote">Greenhouse, Lever, Ashby, Workday, SmartRecruiters, Oracle, Microsoft/Eightfold, Google, Amazon, Apple.</span>
        </div>
      </div>
      <h3>Schedule and mail</h3>
      <div class="card" style="padding:.6rem 1rem">
        <div class="actions">
          <label>Checks per day <input class="num" id="sFreq" type="number" min="1" max="48" value="${state.checks_per_day}"></label>
          <button class="act" id="sFreqGo">Set</button>
          <button class="act" id="sVerify">Verify every page</button>
          <button class="act" id="sCheck">Check every page now</button>
          <span class="hint" id="sStatus">${state.running ? "" : "the scout thread is off (AUTOPILOT_SCOUT=0)"}</span>
        </div>
        <p class="hint">Mail: ${m.configured ? `on, to ${escape((m.to || []).join(", "))} <button class="act small" id="sMail">Send a test</button>`
          : "not set up. AUTOPILOT_SMTP_USER and AUTOPILOT_SMTP_PASS in .env (Gmail: an App Password), then restart the server."}</p>
      </div>`;
  }

  // Decreasing order of fit: the share of a role's required items it meets
  // (met 1, partly a half), highest first; a role not scored yet goes last.
