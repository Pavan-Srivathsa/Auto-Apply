  // Ties: more items met, then the verdict, then the newest posting.
  function fitScore(fit) {
    if (!fit || !fit.verdict) return -1;
    const items = (fit.items || []).filter((i) => i.kind === "must");
    const pool = items.length ? items : (fit.items || []);
    if (!pool.length) return { qualified: 1, stretch: 0.5 }[fit.verdict] ?? 0;
    return pool.reduce((n, i) => n + (i.level === "meets" ? 1 : i.level === "partly" ? 0.5 : 0), 0) / pool.length;
  }

  function byFit(rows, fitOf, dateOf) {
    const rank = (f) => ({ qualified: 0, stretch: 1, unknown: 2, not_qualified: 3 })[(f && f.verdict) || ""] ?? 4;
    // Equal shares: more requirements met is more evidence (8 of 8 over 2 of 2).
    const met = (f) => ((f && f.items) || []).filter((i) => i.kind === "must" && i.level === "meets").length;
    return [...rows].sort((a, b) => fitScore(fitOf(b)) - fitScore(fitOf(a)) || met(fitOf(b)) - met(fitOf(a))
      || rank(fitOf(a)) - rank(fitOf(b))
      || String(dateOf(b) || "").localeCompare(String(dateOf(a) || "")));
  }

  // The watch's settings stay folded unless the person opened them; the
  // choice is remembered, so the roles are what the page shows first.
  function scoutSettingsOpen() {
    try { return localStorage.getItem("scoutSettingsOpen") === "1"; } catch (_) { return false; }
  }

  function renderWatch(w) {
    return `
      <div class="head"><h2>${escape(w.company)}</h2></div>
      ${w.broken ? `<div class="banner stop" style="font-size:15px"><span class="broken">Broken</span> <b>This company does not work.</b> ${escape(w.error)}</div>` :
        `<p class="hint">${w.provider} · ${w.last_total} roles listed, ${w.last_matching} at your level ·
         checked ${escape(fmt(w.last_checked))} · next ${escape(fmt(w.next_check))}</p>`}
      <div class="actions">
        <button class="act" id="wCheck">Check now</button>
        <button class="act" id="wPause">${w.enabled ? "Pause" : "Resume"}</button>
        <span class="hint" id="wNote"></span>
      </div>
      <details class="wsettings" ${scoutSettingsOpen() ? "open" : ""}>
        <summary>Settings · search text, kind, titles, checks per day</summary>
      <div class="card" style="padding:.6rem 1rem">
        <table class="kv">
          <tr><td>Page</td><td><a href="${escape(w.url)}" target="_blank" rel="noopener">${escape(w.url)}</a></td></tr>
          <tr><td>Search text</td><td><textarea id="wQuery" rows="1" style="min-height:2.2rem">${escape(w.query)}</textarea></td></tr>
          <tr><td>Kind</td><td><label class="hint"><input type="checkbox" id="wNotify" ${w.notify ? "checked" : ""}> Notify only: list and mail, I ask for a referral; unticked, new roles go into autopilot</label></td></tr>
          <tr><td>Tab</td><td><label class="hint"><input type="checkbox" id="wOwnTab" ${w.own_tab ? "checked" : ""}> Own tab: list its roles in a Scout tab of their own, not in Jobs</label></td></tr>
          <tr><td>Where</td><td><label class="hint"><input type="checkbox" id="wUs" ${w.us_only ? "checked" : ""}> US only: a role whose location names another country is dropped before anything else</label></td></tr>
          <tr><td>Referrer</td><td><textarea id="wRef" rows="1" style="min-height:2.2rem">${escape(w.referrer)}</textarea></td></tr>
          <tr><td>Title must have one of</td><td><textarea id="wPos" rows="2">${escape(w.positive.join(", "))}</textarea></td></tr>
          <tr><td>and none of</td><td><textarea id="wNeg" rows="2">${escape(w.negative.join(", "))}</textarea></td></tr>
          <tr><td>Checks per day</td><td><input class="num" id="wFreq" type="number" min="1" max="48" value="${w.checks_per_day || ""}" placeholder="${w.checks_per_day_effective}"> <span class="hint">blank = the global ${state.checks_per_day}</span>
            · or once every <input class="num" id="wEvery" type="number" min="0" max="30" value="${w.every_days || ""}" placeholder="–"> days <span class="hint">(overrides checks per day; blank = off)</span></td></tr>
        </table>
        <div class="actions">
          <button class="act primary" id="wSave">Save</button>
          <button class="act" id="wVerify">Verify</button>
          <button class="act danger" id="wDel">Stop watching</button>
        </div>
      </div>
      </details>`;
  }

  // Am I qualified, worked out in Scout: a verdict, its one line, and the
  // requirements behind it on a click.
  function fitBlock(fit) {
    if (!fit || !fit.verdict) return "";
    const label = {qualified: "Qualified", stretch: "Stretch", not_qualified: "Not qualified", unknown: "Fit unknown"}[fit.verdict] || fit.verdict;
    const rows = (fit.items || []).filter((i) => i.level !== "meets").map((i) =>
      `<li><span class="lvl ${escape(i.level)}">${i.level === "missing" ? "Missing" : "Partly"}</span> ${escape(i.text)}${
        i.reason ? `<span class="why">${escape(i.reason)}</span>` : ""}</li>`).join("");
    const score = fitScore(fit);
    return `<div class="fitline ${escape(fit.verdict)}">${score >= 0 && fit.verdict !== "unknown" ? `<span class="score">${Math.round(score * 100)}% match</span> ` : ""}<strong>${label}</strong> ${escape(String(fit.summary || "").replace(/^(Qualified|Stretch|Not qualified):\s*/, ""))}
      ${fit.base ? `<span class="hint">· against ${escape(fit.base)}</span>` : ""}
      ${rows ? `<details><summary>Why</summary><ul class="fitwhy">${rows}</ul></details>` : ""}</div>`;
  }

  function renderListed(w) {
    const rows = byFit(w.listed || [], (r) => r.fit, (r) => r.posted);
    const queued = new Set((state.hits || []).filter((h) => h.watch_id === w.id && h.status === "queued").map((h) => h.posting.id));
    const card = (r) => `
      <div class="hit ${queued.has(r.id) ? "done" : ""}">
        <div class="t"><a href="${escape(r.url)}" target="_blank" rel="noopener">${escape(r.title)}</a></div>
        <div class="m">${r.company ? `${escape(r.company)} · ` : ""}${escape(r.location || "")}${r.posted ? ` · posted ${escape(r.posted)}` : ""}${queued.has(r.id) ? " · in autopilot" : ""}</div>
        ${fitBlock(r.fit)}
        ${r.fit ? "" : `<div class="fitline"><span class="hint">Checking fit…</span></div>`}
        ${queued.has(r.id) ? "" : `<div class="actions"><button class="act primary" data-add="${escape(r.id)}">Add to autopilot</button></div>`}
      </div>`;
    return `<h3>At your level now · ${rows.length}</h3>
      <div class="card">${rows.map(card).join("") || `<p class="empty" style="padding:1rem">${w.last_checked ? "Nothing on the page passes the title and location filters. Loosen them above and Check now." : "Not read yet."}</p>`}</div>`;
  }

  function renderHits(w, notify) {
    const hits = (state.hits || []).filter((h) => w ? h.watch_id === w.id : h.notify === !!notify);
    const auto = w ? !w.notify : !notify;
    // On the autopilot side the queued ones are the news; on the referral
    // side the new ones are, since those need the person.
    const fresh = byFit(hits.filter((h) => auto ? h.status !== "dismissed" : h.status === "new"),
                        (h) => h.fit, (h) => h.posting.posted || h.found_at);
    const rest = hits.filter((h) => !fresh.includes(h));
    const card = (h) => `
      <div class="hit ${h.status !== "new" ? "done" : ""}" data-hit="${h.id}">
        <div class="t"><a href="${escape(h.posting.url)}" target="_blank" rel="noopener">${escape(h.posting.title)}</a>
          <span class="hint">· ${escape(h.company)}</span></div>
        <div class="m">${escape(h.posting.location || "")}${h.posting.posted ? ` · posted ${escape(h.posting.posted)}` : ""}
          · found ${escape(fmt(h.found_at))} · <span class="v-${escape(h.verdict)}">${escape(h.verdict || "not screened")}</span>
          ${h.summary ? ` — ${escape(h.summary)}` : ""}${h.status === "queued" ? " · in autopilot" : h.status === "dismissed" ? " · dismissed" : ""}</div>
        ${fitBlock(h.fit)}
        ${h.notify ? `<pre class="note">${escape(h.note)}</pre>` : ""}
        ${h.status === "new" ? `<div class="actions">
          <button class="act primary" data-queue="${h.id}">Add to autopilot</button>
          ${h.notify ? `<button class="act" data-copy="${h.id}">Copy the note</button>` : ""}
          <button class="act" data-dismiss="${h.id}">Dismiss</button></div>` :
          h.job_id ? `<div class="actions"><button class="act" data-open="${h.job_id}">Open the job</button></div>` : ""}
      </div>`;
    const title = auto ? "Found" : "To ask";
    const empty = auto
      ? `Nothing yet${w ? "" : " on any page"}. The first check of a page only remembers what is there; from then on every new role at your level is screened and goes into autopilot from here.`
      : `Nothing to ask about${w ? "" : " at any company"}. The first check of a page only remembers what is there; from then on every new role at your level shows here with the note.`;
    return `<h3>${title} · ${fresh.length}</h3>
      <div class="card">${fresh.map(card).join("") || `<p class="empty" style="padding:1rem">${empty}</p>`}</div>
      ${rest.length ? `<details><summary>Handled · ${rest.length}</summary><div class="card">${rest.map(card).join("")}</div></details>` : ""}`;
  }

  async function call(path, options, note, onDone) {
    busy = true;
    if (note) note.textContent = "…";
    try {
      const out = await api(path, options);
      if (note) note.textContent = "";
      await onDone?.(out);
    } catch (err) { if (note) note.textContent = err.message; else alert(err.message); }
    busy = false;
  }

  function wire(w) {
    for (const b of $("detail").querySelectorAll("[data-band]")) b.onclick = () => {
      band = b.dataset.band; try { localStorage.setItem("scoutBand", band); } catch (_) {} render(); };
    if ($("jobSearch")) $("jobSearch").oninput = (e) => {
      search = e.target.value; const at = e.target.selectionStart; render();
      const box = $("jobSearch"); box.focus(); box.setSelectionRange(at, at); };
    for (const b of $("detail").querySelectorAll("[data-add-any]")) b.onclick = () => {
      const { watch, id } = JSON.parse(b.dataset.addAny);
      call(`/scout/watch/${watch}/add`, { method: "POST", body: JSON.stringify({ posting_id: id }) }, null, async () => { await refresh(); render(); }); };
    for (const r of $("detail").querySelectorAll("tr[data-watch]")) r.onclick = () => { viewing = r.dataset.watch; render(); };
    if ($("backSources")) $("backSources").onclick = () => { viewing = "sources"; render(); };
    if (!w && !$("sAdd")) {
      for (const b of $("detail").querySelectorAll("[data-queue]")) b.onclick = () =>
        call(`/scout/hits/${b.dataset.queue}/queue`, { method: "POST" }, null, async () => { await refresh(); render(); });
      for (const b of $("detail").querySelectorAll("[data-dismiss]")) b.onclick = () =>
        call(`/scout/hits/${b.dataset.dismiss}/dismiss`, { method: "POST" }, null, async () => { await refresh(); render(); });
      for (const b of $("detail").querySelectorAll("[data-copy]")) b.onclick = () => {
        const hit = state.hits.find((h) => h.id === b.dataset.copy);
        navigator.clipboard?.writeText(hit.note).then(() => { b.textContent = "Copied"; }); };
      for (const b of $("detail").querySelectorAll("[data-open]")) b.onclick = () => { location.hash = b.dataset.open; switchView("jobs"); };
      return;
    }
    if (!w) {
      $("sAdd").onclick = () => {
        const url = $("sUrl").value.trim();
        if (!url) return;
        call("/scout/watch", { method: "POST", body: JSON.stringify({ url, company: $("sCompany").value,
          notify: $("sNotify").checked, referrer: $("sRef").value }) }, $("sNote"), async (out) => {
            const v = out.verify;
            if (v && !v.ok) alert(`Watching, but the page could not be read: ${v.error}`);
            else if (v) alert(`Watching ${out.watch.company}: ${v.total} roles listed, ${v.matching} at your level.${v.matching ? "\n" + v.sample.slice(0, 5).join("\n") : "\nNone match the title filter; open the watch and loosen it."}`);
            viewing = out.watch.id; await refresh(); render(); });
      };
      $("sNotify").onchange = () => { $("sRef").hidden = !$("sNotify").checked; };
      $("sFreqGo").onclick = () => call("/scout/frequency", { method: "POST", body: JSON.stringify({ checks_per_day: Number($("sFreq").value) }) }, $("sStatus"), async () => { await refresh(); render(); });
      $("sVerify").onclick = () => call("/scout/verify", { method: "POST" }, $("sStatus"), async (out) => {
        await refresh(); render();
        $("sStatus").textContent = out.broken ? `${out.broken} broken` : `all ${out.results.length} pages read`; });
      $("sCheck").onclick = () => call("/scout/check", { method: "POST" }, $("sStatus"), async (out) => {
        await refresh(); render();
        const fresh = Object.values(out.results).reduce((n, r) => n + (r.new || 0), 0);
        $("sStatus").textContent = `${fresh} new` + (out.mail.sent ? `, mailed` : out.mail.reason ? ` (${out.mail.reason})` : ""); });
      if ($("sMail")) $("sMail").onclick = () => call("/scout/mail/test", { method: "POST" }, null, (out) => alert(`Sent to ${out.to.join(", ")}`));
    } else {
      const lists = (id) => $(id).value.split(",").map((x) => x.trim()).filter(Boolean);
      $("wSave").onclick = () => call(`/scout/watch/${w.id}`, { method: "PATCH", body: JSON.stringify({
        query: $("wQuery").value.trim(), notify: $("wNotify").checked, us_only: $("wUs").checked, referrer: $("wRef").value.trim(), positive: lists("wPos"), negative: lists("wNeg"),
        checks_per_day: $("wFreq").value ? Number($("wFreq").value) : null,
        every_days: $("wEvery").value ? Number($("wEvery").value) : 0, own_tab: $("wOwnTab").checked }) }, $("wNote"), async () => { await refresh(); render(); });
      $("wVerify").onclick = () => call(`/scout/watch/${w.id}/verify`, { method: "POST" }, $("wNote"), async (out) => {
        await refresh(); render();
        $("wNote").textContent = out.ok ? `${out.total} listed, ${out.matching} at your level` + (out.sample.length ? `: ${out.sample.slice(0, 3).join(" · ")}` : "") : out.error; });
      const folded = document.querySelector(".wsettings");
      if (folded) folded.ontoggle = () => { try { localStorage.setItem("scoutSettingsOpen", folded.open ? "1" : "0"); } catch (_) {} };
      $("wCheck").onclick = () => call(`/scout/watch/${w.id}/check`, { method: "POST" }, $("wNote"), async (out) => {
        await refresh(); render();
        $("wNote").textContent = out.ok ? `${out.new} new` + (out.mail?.sent ? ", mailed" : "") : out.error; });
      $("wPause").onclick = () => call(`/scout/watch/${w.id}`, { method: "PATCH", body: JSON.stringify({ enabled: !w.enabled }) }, $("wNote"), async () => { await refresh(); render(); });
      $("wDel").onclick = () => { if (confirm(`Stop watching ${w.company}? Its hits go too.`))
        call(`/scout/watch/${w.id}`, { method: "DELETE" }, $("wNote"), async () => { viewing = "sources"; await refresh(); render(); }); };
    }
    for (const b of $("detail").querySelectorAll("[data-add]")) b.onclick = () => w &&
      call(`/scout/watch/${w.id}/add`, { method: "POST", body: JSON.stringify({ posting_id: b.dataset.add }) }, null, async () => { await refresh(); render(); });
    for (const b of $("detail").querySelectorAll("[data-queue]")) b.onclick = () =>
      call(`/scout/hits/${b.dataset.queue}/queue`, { method: "POST" }, null, async () => { await refresh(); render(); });
    for (const b of $("detail").querySelectorAll("[data-dismiss]")) b.onclick = () =>
      call(`/scout/hits/${b.dataset.dismiss}/dismiss`, { method: "POST" }, null, async () => { await refresh(); render(); });
    for (const b of $("detail").querySelectorAll("[data-copy]")) b.onclick = () => {
      const hit = state.hits.find((h) => h.id === b.dataset.copy);
      navigator.clipboard?.writeText(hit.note).then(() => { b.textContent = "Copied"; });
    };
    for (const b of $("detail").querySelectorAll("[data-open]")) b.onclick = () => { location.hash = b.dataset.open; switchView("jobs"); };
  }

  return { open, poll };
})();


// ------------------------------------------------------------- Projects --
// A GitHub handle in, the public repositories ranked, the ticked ones
// handed to the interviewer. The scan runs on the server; this polls.
const Projects = (() => {
  let state = null;     // GET /projects
  let viewing = null;   // repo name when reading one
  let busy = false;
  let started = true;   // the profile interview exists; the projects join it

  async function open() {
    viewing = null;
    await refresh();
    render();
  }

  async function refresh() {
    try { state = await api("/projects"); } catch (err) { state = { phase: "error", error: err.message, repos: [], issues: [] }; }
    try { started = (await api("/profile")).phase !== "new"; } catch (_) { started = true; }
  }

  async function poll() {
    if (busy || view !== "projects" || !state) return;
    const moving = state.phase === "scanning" || state.repos.some((r) => r.state === "listed" || r.state === "reading");
    if (!moving) return;
    await refresh();
    render();
  }

  function render() {
    renderNav();
    if (!state) return;
    if (viewing) return renderRepo();
    if (state.phase === "new" || state.phase === "error" || !state.repos.length) return renderStart();
    renderPicks();
  }

  function tone(r) {
    if (r.slug) return "done";
    if (r.state === "error") return "stop";
    if (r.state === "reading" || r.state === "listed") return "agent";
    return r.picked ? "you" : "done";
  }

  function note(r) {
    if (r.slug) return '<span class="ok">in the interview</span>';
    if (r.state === "error") return '<span class="err">not read</span>';
    if (r.state === "reading") return '<span class="pend">reading…</span>';
    if (r.state === "listed") return "queued";
    return escape(r.summary || r.description || r.language || "");
  }

  function renderNav() {
    const repos = state?.repos || [];
    if (!repos.length) {
      $("list").innerHTML = state?.handle ? `<div class="group">${escape(state.handle)}</div>` : "";
      $("count").textContent = "";
      return;
    }
    $("list").innerHTML = `<div class="group">${escape(state.handle)} <span class="n">${repos.length}</span></div>` +
      repos.map((r) => `
        <button class="row" data-name="${escape(r.name)}" data-tone="${tone(r)}" aria-current="${viewing === r.name}">
          <span class="role">${r.rank ? `#${r.rank} ` : ""}${escape(r.name)}</span>
          <span class="cov">${note(r)}</span>
        </button>`).join("");
    for (const button of $("list").querySelectorAll("button[data-name]")) {
      button.onclick = () => { viewing = button.dataset.name; render(); };
    }
    const ready = repos.filter((r) => r.state === "ready").length;
    $("count").textContent = state.phase === "scanning" ? `${ready}/${repos.length} read` : `${repos.length} repositories`;
  }

  function renderStart() {
    $("detail").innerHTML = `
      <div class="head"><h2>Projects from GitHub</h2></div>
      <p>Give me a GitHub handle and I read every public repository on it: the README, the
      file tree, the manifests, the heads of a few files, and how many commits are yours.
      Each one gets a short write-up, the list is ranked, and the best ten are ticked. Confirm
      the ticks and the interviewer asks one to three questions per project, only what GitHub
      cannot tell. A repository whose name matches a project on the resume becomes that project.
A project can carry several links — the repository, a store
      listing, the live site — and the one you tick is what the resume hyperlinks.</p>
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      <div class="actions">
        <textarea id="handle" rows="1" style="min-height:2.6rem;max-width:22rem" placeholder="github handle">${escape(state.handle || "")}</textarea>
        <button class="act primary" id="scan">Read the repositories</button>
        <span class="hint">Public repositories only. Around a minute per ten.</span>
      </div>`;
    $("scan").onclick = () => scan();
    $("handle").onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); scan(); } };
  }

  async function scan() {
    const handle = $("handle").value.trim();
    if (!handle) return;
    busy = true;
    try {
      state = await api("/projects/scan", { method: "POST", body: JSON.stringify({ handle }) });
      render();
    } catch (err) { alert(err.message); }
    busy = false;
  }

  function renderPicks() {
    const repos = state.repos;
    const scanning = state.phase === "scanning";
    const ready = repos.filter((r) => r.state === "ready").length;
    const ticked = repos.filter((r) => r.picked && !r.slug);
    const added = repos.filter((r) => r.slug).length;
    const confirmable = started && !scanning && ticked.length && ticked.every((r) => r.state === "ready");
    if (!started) api("/profile").then((p) => { if (p.phase !== "new") { started = true; render(); } }).catch(() => {});
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(state.handle)}</h2>
        <span class="co">${scanning ? `reading · ${ready}/${repos.length}` : `${repos.length} repositories · ${added} in the interview`}</span></div>
      ${state.error ? `<div class="banner stop">${escape(state.error)}</div>` : ""}
      ${scanning ? `<div class="banner warn">Reading the repositories, best first. Tick and untick while it runs; confirm once it is done.</div>` : ""}
      ${started ? "" : `<div class="banner warn">Start the profile interview first (Profile tab); the projects join it.</div>`}
      <p class="hint">The best ${state.auto_pick} are ticked: newest, most worked on, starred, documented. An old project
      that matters still belongs here; tick it. Click a row on the left to read what was found and to change its links.</p>
      <div class="card" style="padding:.4rem .8rem">${repos.map((r) => `
        <label style="display:flex;gap:.7rem;align-items:baseline;padding:.35rem 0;border-bottom:1px solid var(--line)">
          <input type="checkbox" data-pick="${escape(r.name)}" ${r.picked || r.slug ? "checked" : ""} ${r.slug || r.state === "error" ? "disabled" : ""}>
          <span style="color:var(--muted);min-width:2.2rem">#${r.rank || "–"}</span>
          <span style="flex:1;min-width:0">
            <strong>${escape(r.name)}</strong>
            <span class="hint" style="margin-left:.5rem">${r.language ? escape(r.language) + " · " : ""}${r.pushed_at ? "pushed " + escape(r.pushed_at.slice(0, 10)) : ""}${r.commits >= 0 ? " · " + r.commits + " commits" : ""}${r.stars ? " · ★" + r.stars : ""}</span>
            <br><span class="hint">${r.on_resume ? `<span class="ok">on the resume as ${escape(r.on_resume)}</span> · ` : ""}${note(r)}</span>
          </span>
        </label>`).join("")}</div>
      <div class="actions">
        <button class="act primary" id="confirm" ${confirmable ? "" : "disabled"}>Add ${ticked.length} to the interview</button>
        <button class="act" id="rescan" ${scanning ? "disabled" : ""}>Scan again</button>
        <span class="hint">${added ? "The Profile tab asks about the added ones." : ""}</span>
      </div>
      ${state.issues?.length ? `<details><summary>Skipped · ${state.issues.length}</summary><ul>${state.issues.map((i) => `<li>${escape(i)}</li>`).join("")}</ul></details>` : ""}`;
    for (const box of $("detail").querySelectorAll("input[data-pick]")) {
      box.onchange = async () => {
        try { state = await api(`/projects/${encodeURIComponent(box.dataset.pick)}/pick`, { method: "POST", body: JSON.stringify({ picked: box.checked }) }); }
        catch (err) { alert(err.message); }
        render();
      };
    }
    $("confirm").onclick = async () => {
      busy = true;
      $("confirm").disabled = true; $("confirm").textContent = "Adding…";
      try {
        state = await api("/projects/confirm", { method: "POST", body: "{}" });
        render();
        if (confirm("Added. Open the Profile tab and answer their questions now?")) switchView("profile");
      } catch (err) { alert(err.message); render(); }
      busy = false;
    };
    $("rescan").onclick = () => { state = { ...state, phase: "new", repos: [] }; render(); };
  }

  async function renderRepo() {
    const r = state.repos.find((x) => x.name === viewing);
    if (!r) { viewing = null; return render(); }
    $("detail").innerHTML = `
      <div class="head"><h2>${escape(r.name)}</h2><span class="co">${r.rank ? `#${r.rank} · ` : ""}${escape(r.full_name)}</span></div>
      <div class="actions">
        <button class="act" id="back">← All repositories</button>
        ${r.slug ? `<span class="hint">In the interview as <strong>${escape(r.slug)}</strong>.</span>` : ""}
      </div>
      ${r.error ? `<div class="banner stop">${escape(r.error)}</div>` : ""}
      <h3>Links</h3>
      <div class="card" style="padding:.4rem .8rem">${(r.links || [r.url]).map((u) => `
        <label style="display:flex;gap:.7rem;align-items:baseline;padding:.35rem 0;border-bottom:1px solid var(--line)">
          <input type="radio" name="chosen" data-choose="${escape(u)}" ${u === (r.link || r.url) ? "checked" : ""}>
          <span style="flex:1;min-width:0;overflow-wrap:anywhere">${escape(u)}${u === r.url ? ` <span class="hint">the repository</span>` : ""}</span>
          <a href="${escape(u)}" target="_blank" rel="noopener" class="hint">open ↗</a>
          ${u === r.url ? "" : `<button class="act" data-drop="${escape(u)}">Remove</button>`}
        </label>`).join("")}</div>
      <div class="actions">
        <textarea id="link" rows="1" style="min-height:2.6rem;max-width:40rem" placeholder="https://chromewebstore.google.com/detail/..."></textarea>
        <button class="act" id="addLink">Add a link</button>
      </div>
      <p class="hint">A project can live at more than one address: the repository, a store listing, the deployed site.
      Add them all; the one ticked is what the tailored resume hyperlinks.</p>
      ${r.questions?.length ? `<h3>The interviewer will ask</h3><ul>${r.questions.map((q) => `<li>${escape(q)}</li>`).join("")}</ul>` : ""}
      <h3>What was found</h3>
      <div class="card doc" id="doc">${r.state === "ready" ? "loading…" : r.state === "error" ? "Not read." : "Not read yet."}</div>`;
    $("back").onclick = () => { viewing = null; render(); };
    const linkAction = async (link, action) => {
      try {
        state = await api(`/projects/${encodeURIComponent(r.name)}/link`, { method: "POST", body: JSON.stringify({ link, action }) });
        render();
      } catch (err) { alert(err.message); render(); }
    };
    $("addLink").onclick = () => { const v = $("link").value.trim(); if (v) linkAction(v, "add"); };
    for (const box of $("detail").querySelectorAll("input[data-choose]")) {
      box.onchange = () => linkAction(box.dataset.choose, "choose");
    }
    for (const drop of $("detail").querySelectorAll("button[data-drop]")) {
      drop.onclick = (event) => { event.preventDefault(); linkAction(drop.dataset.drop, "remove"); };
    }
    if (r.state === "ready") {
      const text = await fetch(`/projects/${encodeURIComponent(r.name)}/scaffold`).then((x) => x.text());
      if ($("doc") && viewing === r.name) $("doc").innerHTML = Profile.docMarkdown(text);
    }
  }

  return { open, poll };
})();

// ------------------------------------------------------------- Resumes --
// Any number of independently formatted master resumes. Each is compiled
// and profiled once; a job routes to one of them before the normal tailor
// runs. Archiving removes a resume from new routing without deleting it.
const Resumes = (() => {
  let state = null;
  let viewing = "add";
  let busy = false;

  async function refresh() {
    state = await api("/setup");
    if (viewing !== "add" && viewing !== "bank" && !(state.resumes || []).some((row) => row.id === viewing)) {
      viewing = "add";
    }
  }

  async function open() {
    await refresh();
    render();
  }

  async function poll() {
    if (busy || view !== "resumes") return;
    await refresh();
    renderNav();
  }

  function renderNav() {
    const rows = state?.resumes || [];
    $("count").textContent = `${rows.filter((row) => row.active).length} active resumes`;
    $("list").innerHTML = `<button class="row" data-resume="add" data-tone="agent" aria-current="${viewing === "add"}">
        <span class="role">Add resume</span><span class="cov">LaTeX source</span></button>
      <button class="row" data-resume="bank" data-tone="agent" aria-current="${viewing === "bank"}">
        <span class="role">Bullet bank</span><span class="cov">drafted from your stories</span></button>` +
      rows.map((row) => `<button class="row" data-resume="${escape(row.id)}"
          data-tone="${row.active ? "done" : "stop"}" aria-current="${viewing === row.id}">
          <span class="role">${escape(row.label)}${row.primary ? " · primary" : ""}</span>
          <span class="cov">${row.active ? row.ready ? "ready" : "needs attention" : "archived"}</span>
        </button>`).join("");
    for (const button of $("list").querySelectorAll("[data-resume]")) {
      button.onclick = () => { viewing = button.dataset.resume; render(); };
    }
  }

  function form(row=null) {
    return `<div class="card resume-manager">
      <label>Label</label>
      <input type="text" id="resumeLabel" value="${escape(row?.label || "")}"
             placeholder="e.g. ML / AI engineering">
      <label>When should this resume be used?</label>
      <textarea id="resumeDescription" rows="3"
        placeholder="e.g. ML engineering, forecasting, LLM applications, model deployment">${escape(row?.description || "")}</textarea>
      <div class="actions">
        <label class="act primary">${row ? "Replace .tex" : "Choose .tex"}
          <input type="file" id="resumeUpload" accept=".tex" hidden></label>
        <span class="hint" id="resumeUploadNote">The file is compiled and a compact routing profile is generated once.</span>
      </div>
    </div>`;
  }

  // Bullets drafted for jobs from the knowledge base and kept because every
  // fact is on file and Jev rated them strong (tailor.bank). The master
  // resumes are never changed by them; tailoring offers them as options.
  async function renderBank() {
    renderNav();
    const rows = (await api("/bullets")).bullets || [];
    const byCompany = {};
    for (const b of rows) (byCompany[b.company] ||= []).push(b);
    $("detail").innerHTML = `<div class="head"><h2>Bullet bank</h2><span class="state agent">${rows.length} bullets</span></div>
      <p class="hint">Written for postings from your interview stories. Kept only when every number and name is on file and Jev rated it supported and strong. Your master resumes never change; tailoring may use one of these in place of a weaker bullet under the same job. Delete any you would not sign.</p>
      ${Object.entries(byCompany).map(([company, list]) => `<h3>${escape(company)} · ${list.length}</h3>
        <div class="card">${list.map((b) => `<div class="hit">
          <div class="t">${escape(b.text)}</div>
          <div class="m">${escape(b.role)}${b.terms?.length ? ` · terms: ${b.terms.map(escape).join(", ")}` : ""}
            · strength ${b.rating ?? "–"} · supported ${b.supported ?? "–"} · used ${b.uses}× · from ${escape((b.sources || []).join(", "))}</div>
          <div class="actions"><button class="act danger" data-bullet="${escape(b.id)}">Delete</button></div></div>`).join("")}</div>`).join("")
        || `<p class="empty">Empty. Bullets are drafted the next time a job is tailored.</p>`}`;
    for (const button of $("detail").querySelectorAll("[data-bullet]")) button.onclick = async () => {
      if (!confirm("Delete this bullet from the bank?")) return;
      await api(`/bullets/${button.dataset.bullet}`, { method: "DELETE" });
      renderBank();
    };
  }

  function render() {
    if (viewing === "bank") return renderBank();
    renderNav();
    const row = (state?.resumes || []).find((item) => item.id === viewing);
    if (!row) {
      $("detail").innerHTML = `<div class="head"><h2>Add a master resume</h2></div>
        <p class="hint">Each resume keeps its own content and LaTeX design. Autopilot selects one before tailoring.</p>
        ${form()}`;
    } else {
      $("detail").innerHTML = `<div class="head"><h2>${escape(row.label)}</h2>
          <span class="state ${row.active ? "go" : "stop"}">${row.active ? "active" : "archived"}</span>
          ${row.primary ? '<span class="state agent">primary fallback</span>' : ""}</div>
        ${row.summary ? `<div class="card prose"><p>${escape(row.summary)}</p>
          ${row.target_roles?.length ? `<p><strong>Target roles:</strong> ${row.target_roles.map(escape).join(", ")}</p>` : ""}
          ${row.strengths?.length ? `<p><strong>Routing evidence:</strong> ${row.strengths.map(escape).join(", ")}</p>` : ""}</div>` : ""}
        ${row.problems?.length ? `<div class="banner stop">${escape(row.problems.join("; "))}</div>` : ""}
        <div class="actions">
          ${!row.primary && row.active ? '<button class="act" id="resumePrimary">Make primary fallback</button>' : ""}
          <button class="act ${row.active ? "danger" : ""}" id="resumeActive">${row.active ? "Archive" : "Restore"}</button>
          ${!row.active ? '<button class="act danger" id="resumeDelete">Delete permanently</button>' : ""}
        </div>
        ${form(row)}
        ${row.compiled ? `<iframe src="/setup/resume/${encodeURIComponent(row.id)}/pdf?v=${encodeURIComponent(row.version || row.id)}#toolbar=0&view=Fit"
          title="${escape(row.label)}"></iframe>` : ""}`;
    }
    wire(row);
  }

  function wire(row) {
    if ($("resumePrimary")) $("resumePrimary").onclick = async () => {
      await api(`/setup/resume/${encodeURIComponent(row.id)}/primary`, { method: "POST", body: "{}" });
      await refresh(); render();
    };
    if ($("resumeActive")) $("resumeActive").onclick = async () => {
      const action = row.active ? "archive" : "restore";
      if (row.active && !confirm(`Archive ${row.label}? Existing jobs keep it; new jobs will not use it.`)) return;
      try {
        state = await api(`/setup/resume/${encodeURIComponent(row.id)}/active`, {
          method: "POST", body: JSON.stringify({ active: !row.active }),
        });
        render();
      } catch (err) { alert(`Could not ${action}: ${err.message}`); }
    };
    if ($("resumeDelete")) $("resumeDelete").onclick = async () => {
      if (!confirm(`Delete ${row.label} permanently?\n\nIts source, PDF, and saved history will be removed.`)) return;
      try {
        state = await api(`/setup/resume/${encodeURIComponent(row.id)}/delete`, {
          method: "POST", body: "{}",
        });
        viewing = "add";
        render();
      } catch (err) { alert(`Could not delete: ${err.message}`); }
    };
    $("resumeUpload").onchange = async (event) => {
      const file = event.target.files[0];
      if (!file || busy) return;
      const label = $("resumeLabel").value.trim();
      if (!label) { $("resumeUploadNote").textContent = "Name this resume first."; return; }
      busy = true;
      $("resumeUploadNote").textContent = "Compiling and building its routing profile…";
      try {
        state = await api("/setup/resume", {
          method: "POST",
          body: JSON.stringify({
            name: file.name, text: await file.text(), base_id: row?.id || null,
            label, description: $("resumeDescription").value.trim(),
          }),
        });
        viewing = state.resume_base?.id || row?.id || viewing;
        render();
      } catch (err) {
        $("resumeUploadNote").textContent = err.message;
      } finally { busy = false; }
    };
  }

  return { open, poll };
})();

// ---------------------------------------------------------------- Setup --
// What is missing before the first job: the OpenRouter key (typed here and
// checked against OpenRouter, never in a terminal or a chat), the master
// resume, Chrome. The bar goes away once all three are there.
const Setup = (() => {
  let last = null;
  let busy = false;

  async function poll() {
    if (busy) return;
    try { last = await api("/setup"); } catch (_) { return; }
    render();
  }

  function render() {
    const s = last;
    const bar = $("setupbar");
    if (s && !s.onboarded) {
      bar.hidden = true;
      if ($("onboard").hidden) Onboard.show(s);
      return;
    }
    if (!s || (s.key && s.resume && s.chrome)) { bar.hidden = true; return; }
    if (!bar.hidden && bar.contains(document.activeElement)) return;
    bar.hidden = false;
    const item = (done, text) => `<li class="${done ? "done" : ""}">${text}</li>`;
    bar.innerHTML = `<b>Before the first job</b>
      <ol>
        ${item(s.key, s.key ? "OpenRouter key saved." : `Paste your OpenRouter key. Make one at
          <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener">openrouter.ai/settings/keys</a>
          and add a few dollars of credit; a job costs a few cents.
          <div class="keyrow"><input id="orKey" type="password" autocomplete="off" placeholder="sk-or-v1-…">
          <button class="act primary" id="orSave" disabled>Save key</button></div>
          <span class="hint" id="orMsg">Kept on this Mac only, in ${escape(s.home)}/.env.</span>`)}
        ${item(s.resume, s.resume ? "Master resume in place." : s.resume_problems?.length
          ? `The master resume cannot be tailored yet: ${escape(s.resume_problems.join("; "))}.
             Upload a fixed <code>.tex</code> on the setup screens, or ask Claude Code.`
          : `Upload your resume's LaTeX source (<code>.tex</code>) on the setup screens, or put it at
             <code>${escape(s.resume_path)}</code>. Not a PDF or a Word file.`)}
        ${item(s.chrome, s.chrome ? "Google Chrome found." : "Install Google Chrome; the forms are filled in it.")}
      </ol>`;
    const input = $("orKey");
    if (!input) return;
    input.oninput = () => { $("orSave").disabled = !input.value.trim(); };
    $("orSave").onclick = async () => {
      busy = true; $("orSave").disabled = true; $("orMsg").textContent = "Checking with OpenRouter…";
      try { last = await api("/setup/key", { method: "POST", body: JSON.stringify({ key: input.value }) }); input.value = ""; }
      catch (err) { $("orMsg").textContent = err.message; $("orSave").disabled = false; busy = false; return; }
      busy = false; render();
    };
  }

  return { poll };
})();
Setup.poll();

// ------------------------------------------------------------ Onboarding --
// The first run, one screen at a time: what Autopilot is, the OpenRouter
// key, the master resume as the person's own LaTeX file (never a PDF or a
// Word file: the tailor edits the source, and nothing is lost converting),
// Jobright (the extension and the sign-in, in the Autopilot Chrome), then
// the offer of the profile interview, which is optional. Shown until finished once (`onboarded`),
// or never on a copy that already has jobs.
const Onboard = (() => {
  let s = null;           // GET /setup
  let step = 0;
  let signedIn = false;
  let timer = null;

  const steps = () => ["welcome", "key", "resume", "jobright", "profile"];
  let upload = null;      // the last /setup/resume reply: compiled, compile_error

  function show(state) {
    s = state;
    document.body.classList.add("onboarding");
    $("onboard").hidden = false;
    render();
  }

  function hide() {
    clearInterval(timer); timer = null;
    document.body.classList.remove("onboarding");
    $("onboard").hidden = true;
  }

  async function refresh() {
    try { s = await api("/setup"); } catch (_) {}
  }

  function open(page) {
    api("/setup/open", { method: "POST", body: JSON.stringify({ page }) })
      .then((r) => { if (!r.opened) window.open(r.url, "_blank", "noopener"); })
      .catch(() => {});
  }

  function render() {
    const list = steps();
    step = Math.min(step, list.length - 1);
    const name = list[step];
    clearInterval(timer); timer = null;
    const prog = `<div class="prog"><i style="width:${Math.round(100 * (step + 1) / list.length)}%"></i></div>
      <div class="sec">Setup · ${step + 1} of ${list.length}</div>`;
    const back = step ? `<button class="act" id="obBack">Back</button>` : "";
    let body = "";
    if (name === "welcome") {
      body = `<div class="q">Autopilot applies to jobs with you, not for you.</div>
        <p>You open a posting on Jobright. Autopilot screens it, tailors your resume and a cover letter to it, fills the
        application form, and stops. You read the filled form and press Submit yourself, every time; it never submits.</p>
        <p>Three things to set up, about five minutes.</p>
        <div class="actions"><button class="act primary" id="obNext">Start</button></div>`;
    } else if (name === "key") {
      body = `<div class="q">Your OpenRouter key</div>
        <p>The models that tailor and screen run through OpenRouter, on your own account. Make a key, add a few dollars of
        credit (a job costs a few cents; "Use Opus" about twenty), and paste the key here.</p>
        ${s.key ? `<p class="ok">✓ Key saved and checked with OpenRouter.</p>` : `
        <div class="actions"><button class="act" id="obOR">Open openrouter.ai/settings/keys</button></div>
        <input type="password" id="obKey" autocomplete="off" placeholder="sk-or-v1-…">
        <p class="hint" id="obKeyMsg">Checked with OpenRouter, then kept on this Mac only (${escape(s.home)}/.env).</p>`}
        <div class="actions">${back}<button class="act primary" id="obNext" ${s.key ? "" : "disabled"}>${s.key ? "Next" : "Save key"}</button></div>`;
    } else if (name === "jobright") {
      body = `<div class="q">Jobright</div>
        <p>Jobs come in from Jobright: open a posting there and Autopilot's banner screens it and queues it. Jobright's
        extension also fills the forms first. Both happen in this Chrome window, Autopilot's own, so do them here.</p>
        <ol class="obsteps">
          <li class="${s.jobright ? "done" : ""}">Install the Jobright extension.
            ${s.jobright ? `<span class="ok">✓ installed</span>` : `<button class="act" id="obExt">Open the Chrome Web Store</button>
            <span class="hint">Press "Add to Chrome" there; this page notices by itself.</span>`}</li>
          <li class="${signedIn ? "done" : ""}">Sign in to Jobright.
            <button class="act" id="obJR">Open jobright.ai</button>
            <label class="hint"><input type="checkbox" id="obSigned" ${signedIn ? "checked" : ""}> I'm signed in</label></li>
        </ol>
        <div class="actions">${back}<button class="act primary" id="obNext" ${s.jobright && signedIn ? "" : "disabled"}>Next</button>
          <button class="act" id="obLater">Do this later</button></div>`;
    } else if (name === "resume") {
      const problems = s.resume_problems || [];
      body = `<div class="q">Your resume, in LaTeX</div>
        <p>Autopilot tailors the LaTeX source of your own resume, in your own design: every macro, font and spacing
        stays exactly as you set it, and only the words in your summary, experience, projects and skills are adapted to
        each job. Upload your <code>.tex</code> file. A PDF or a Word file will not do.</p>
        ${s.resume ? `<p class="ok">✓ Your resume is in, compiles, and Autopilot can read its sections.</p>` : ""}
        ${upload && !upload.compiled ? `<div class="banner stop"><b>It did not compile.</b> ${escape(upload.compile_error.slice(0, 400))}
          <br>A custom <code>.cls</code> or font next to it is not uploaded; ask Claude Code to add it.</div>` : ""}
        ${!s.resume && problems.length ? `<div class="banner warn"><b>Your file is in, but Autopilot cannot find what to
          tailor in it</b>: ${escape(problems.join("; "))}.
          <br>Your design stays; only a heading may need a clearer name. Or ask Claude Code in the Autopilot folder:
          <i>"make Autopilot read my resume"</i>.</div>` : ""}
        <div class="actions">
          <label class="act primary">${s.resume || problems.length ? "Upload a new .tex" : "Upload your .tex"}
            <input type="file" id="obTex" accept=".tex" hidden></label>
          <a class="act" href="/setup/template" download>No LaTeX resume? Get a template</a>
        </div>
        <p class="hint" id="obTexMsg">Any LaTeX resume works: Jake's, Awesome-CV, moderncv, your own. No LaTeX resume
        yet? Take the template, write yours into it (any editor, or Overleaf), and upload it here. You can add more
        role-specific formats later from the Resumes tab.</p>
        <div class="actions">${back}<button class="act primary" id="obNext" ${s.resume ? "" : "disabled"}>Next</button>
          <button class="act" id="obLater">Do this later</button></div>`;
    } else {
      body = `<div class="q">You're set.</div>
        <p>Open a posting on Jobright and Autopilot takes it from there. Every job lands on the Jobs tab; the filled form
        waits for your Submit.</p>
        <div class="banner go"><b>For better tailoring, do the profile interview.</b> Ten to twenty minutes, by voice or
        text: what you did in each role and project, in your own words. The tailor uses it to rewrite bullets with the
        things your resume leaves out. Optional; you can start it any time from the Profile tab.</div>
        <div class="actions">${back}<button class="act primary" id="obProfile">Start the profile interview</button>
          <button class="act" id="obSkip">Skip for now</button></div>`;
    }
    $("onboard").innerHTML = `<div class="qform">${prog}${body}</div>`;
    wire(name);
  }

  function wire(name) {
    if ($("obBack")) $("obBack").onclick = () => { step--; render(); };
    const next = () => { step++; render(); };
    if (name === "welcome") $("obNext").onclick = next;
    if (name === "key") {
      if (s.key) { $("obNext").onclick = next; return; }
      $("obOR").onclick = () => open("openrouter");
      const input = $("obKey");
      input.oninput = () => { $("obNext").disabled = !input.value.trim(); };
      input.onkeydown = (e) => { if (e.key === "Enter" && input.value.trim()) $("obNext").click(); };
      $("obNext").onclick = async () => {
        $("obNext").disabled = true; $("obKeyMsg").textContent = "Checking with OpenRouter…";
        try { s = await api("/setup/key", { method: "POST", body: JSON.stringify({ key: input.value }) }); }
        catch (err) { $("obKeyMsg").textContent = err.message; $("obNext").disabled = false; return; }
        render();
      };
      input.focus();
    }
    if (name === "jobright") {
      if ($("obExt")) $("obExt").onclick = () => open("jobright_extension");
      $("obJR").onclick = () => open("jobright");
      $("obSigned").onchange = (e) => { signedIn = e.target.checked; render(); };
      $("obNext").onclick = next;
      $("obLater").onclick = next;
      // The extension shows up in the profile folder a moment after "Add to Chrome".
      if (!s.jobright) timer = setInterval(async () => { await refresh(); if (s.jobright) render(); }, 3000);
    }
    if (name === "resume") {
      $("obNext").onclick = next;
      $("obLater").onclick = next;
      $("obTex").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        $("obTexMsg").textContent = "Compiling… the first compile downloads LaTeX packages and can take a minute.";
        for (const b of $("onboard").querySelectorAll("button, .act")) b.setAttribute("disabled", "");
        try {
          upload = await api("/setup/resume", { method: "POST", body: JSON.stringify({ name: file.name, text: await file.text() }) });
          s = upload;
        } catch (err) { upload = null; render(); $("obTexMsg").textContent = err.message; return; }
        render();
      };
    }
    if (name === "profile") {
      const finish = async (target) => {
        try { await api("/setup/done", { method: "POST" }); } catch (_) {}
        hide();
        switchView(target);
      };
      $("obProfile").onclick = () => finish("profile");
      $("obSkip").onclick = () => finish("jobs");
    }
  }

  return { show, hide };
})();

// --------------------------------------------------------------- Report --
// A prefilled GitHub issue, opened in the person's own browser. The app
// sends nothing: they read it there and submit, or do not.
(() => {
  const dialog = $("reportDialog");
  const kind = () => dialog.querySelector("input[name=rkind]:checked").value;
  const sync = () => {
    $("rsend").disabled = !$("rtext").value.trim();
    $("rtextLabel").textContent = kind() === "problem" ? "What happened" : "What you would like";
  };
  $("reportOpen").onclick = async () => {
    $("rmsg").textContent = "This opens a GitHub issue in your browser, filled in. Nothing is sent until you press Submit "
      + "there. The repository is public: leave out your name, contact details and resume.";
    $("rdiag").value = "Reading…";
    dialog.showModal();
    sync();
    try { $("rdiag").value = (await api("/report")).diagnostics; } catch (err) { $("rdiag").value = ""; }
  };
  for (const r of dialog.querySelectorAll("input[name=rkind]")) r.onchange = sync;
  $("rtext").oninput = sync;
  $("rsend").onclick = async (e) => {
    e.preventDefault();
    try {
      const r = await api("/report/open", { method: "POST", body: JSON.stringify({
        kind: kind(), title: $("rtitle").value, text: $("rtext").value, diagnostics: $("rdiag").value }) });
      if (!r.opened) window.open(r.url, "_blank", "noopener");
      $("rtitle").value = ""; $("rtext").value = "";
      dialog.close();
    } catch (err) { $("rmsg").textContent = err.message; }
  };
})();

// -------------------------------------------------------------- Prompts --
// Every system prompt, editable, plus the Workshop: say what should work
// differently and a model proposes the edit. Nothing a model proposes is
// applied without Apply; every save is in the prompt's history; Reset
// brings the stock text back. An update that changed a prompt the person
// had edited is merged at startup; a merge that conflicts is red here.
const Prompts = (() => {
  let list = [];          // GET /prompts
  let shop = null;        // GET /workshop
  // ?view=prompts&prompt=<name> opens one prompt directly.
  let viewing = new URLSearchParams(location.search).get("prompt") || "workshop";
  let detail = null;      // GET /prompts/<name> for the open prompt
  let busy = false;
  let showDiff = false;

  async function open() {
    await refresh();
    if (viewing !== "workshop") await load(viewing);
    render();
  }

  async function refresh() {
    try { list = (await api("/prompts")).prompts; } catch (_) { list = []; }
    try { shop = await api("/workshop"); } catch (err) { shop = { proposals: [], unseen: 0, error: err.message }; }
  }

  async function load(name) {
    try { detail = await api(`/prompts/${encodeURIComponent(name)}`); showDiff = false; }
    catch (_) { viewing = "workshop"; detail = null; }
  }

  async function poll() {
    // A learned proposal lands on its own after a re-tailor; show it, but
    // never redraw under an edit in progress.
    if (busy || view !== "prompts" || viewing !== "workshop") return;
    const before = JSON.stringify(shop?.proposals?.map((p) => p.id + p.state));
    await refresh();
    renderNav();
    if (JSON.stringify(shop?.proposals?.map((p) => p.id + p.state)) !== before) render();
  }

  function renderNav() {
    const pending = (shop?.proposals || []).filter((p) => p.state === "pending").length;
    const edited = list.filter((p) => p.edited).length;
    $("count").textContent = `${list.length} prompts · ${edited} edited`;
    const groups = [...new Set(list.map((p) => p.group))];
    $("list").innerHTML = `<button class="row" data-name="workshop-view" data-tone="agent" aria-current="${viewing === "workshop"}">
        <span class="role">Workshop</span><span class="cov">${pending ? `${pending} to review` : "ask for a change"}</span></button>` +
      groups.map((g) => `<div class="group">${escape(g)} <span class="n">${list.filter((p) => p.group === g).length}</span></div>` +
        list.filter((p) => p.group === g).map((p) => `
          <button class="row" data-name="${escape(p.name)}" data-tone="${p.conflict ? "stop" : p.edited ? "you" : "done"}"
                  aria-current="${viewing === p.name}">
            <span class="role">${escape(p.title)}</span>
            <span class="cov">${p.conflict ? '<span class="err">update conflict</span>' : p.edited ? '<span class="ok">edited</span>' : "stock"} · ${escape(p.name)}</span>
          </button>`).join("")).join("");
    for (const b of $("list").querySelectorAll("button[data-name]")) {
      b.onclick = async () => {
        if (dirty() && !confirm("Leave without saving this prompt?")) return;
        viewing = b.dataset.name === "workshop-view" ? "workshop" : b.dataset.name;
        if (viewing !== "workshop") await load(viewing);
        render();
      };
    }
  }

  function dirty() {
    const box = $("promptText");
    return box && detail && box.value !== detail.text;
  }

  function diffHtml(text) {
    return `<div class="diff">${text.split("\n").map((line) => {
      const cls = line.startsWith("@@") ? "h" : line.startsWith("+++") || line.startsWith("---") ? "h"
        : line.startsWith("+") ? "a" : line.startsWith("-") ? "d" : "";
      return `<div class="${cls}">${escape(line) || " "}</div>`;
    }).join("")}</div>`;
  }

  // A line diff in the browser, for "changes from stock": longest common
  // subsequence over lines, fine for prompts of a few hundred lines.
  function lineDiff(a, b) {
    const x = a.split("\n"), y = b.split("\n");
    const n = x.length, m = y.length;
    const t = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      t[i][j] = x[i] === y[j] ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { out.push(" " + x[i]); i++; j++; }
      else if (t[i + 1][j] >= t[i][j + 1]) out.push("-" + x[i++]);
      else out.push("+" + y[j++]);
    }
    while (i < n) out.push("-" + x[i++]);
    while (j < m) out.push("+" + y[j++]);
    // Only the changed lines and two either side.
    const keep = new Set();
    out.forEach((l, k) => { if (l[0] !== " ") for (let d = -2; d <= 2; d++) keep.add(k + d); });
    const lines = []; let gap = false;
    out.forEach((l, k) => { if (keep.has(k)) { lines.push(l); gap = false; } else if (!gap) { lines.push("@@"); gap = true; } });
    return lines.join("\n");
  }

  function render() {
    renderNav();
    $("detail").innerHTML = viewing === "workshop" ? renderWorkshop() : renderPrompt();
    if (viewing === "workshop") wireWorkshop(); else wirePrompt();
  }

  // ---------------------------------------------------------- one prompt --
  function renderPrompt() {
    const d = detail;
    if (!d) return `<p class="empty">Loading…</p>`;
    return `<div class="head"><h2>${escape(d.title)}</h2><span class="hint">${escape(d.name)}</span>
        ${d.edited ? '<span class="state go">edited</span>' : '<span class="state">stock</span>'}</div>
      ${d.note ? `<p class="hint">${escape(d.note)}</p>` : ""}
      ${d.conflict ? `<div class="banner stop"><b>An update changed this prompt where you had changed it too.</b>
        Your version is still the one in use. Below is the merge with both sides marked; edit it into one text and Save,
        or keep yours as it is and Save.
        <div class="actions"><button class="act" id="useMerge">Load the marked-up merge into the editor</button></div></div>` : ""}
      <textarea class="promptedit" id="promptText" spellcheck="false">${escape(d.text)}</textarea>
      <div class="actions">
        <button class="act primary" id="promptSave" disabled>Save</button>
        <button class="act" id="promptDiff" ${d.edited ? "" : "disabled"}>${showDiff ? "Hide" : "Show"} changes from stock</button>
        <button class="act danger" id="promptReset" ${d.edited || d.conflict ? "" : "disabled"}>Reset to stock</button>
        <span class="hint" id="promptMsg"></span>
      </div>
      ${showDiff ? diffHtml(lineDiff(d.stock, d.text)) : ""}
      ${d.history.length ? `<h3>History</h3><table class="kv history">${d.history.map((h) => `
        <tr><td>${escape(h.when.replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d).*/, "$1-$2-$3 $4:$5"))} · ${escape(h.why)}</td>
        <td><button class="act" data-restore="${escape(h.version)}">Restore</button></td></tr>`).join("")}</table>
        <p class="hint">Each entry is the text as it was before that change.</p>` : ""}`;
  }

  function wirePrompt() {
    const box = $("promptText");
    if (!box) return;
    box.oninput = () => { $("promptSave").disabled = box.value === detail.text || !box.value.trim(); };
    box.onkeydown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (!$("promptSave").disabled) $("promptSave").click(); }
    };
    $("promptSave").onclick = () => act(`/prompts/${detail.name}`, { text: box.value }, "Saved. The next job uses it.");
    $("promptReset").onclick = () => {
      if (confirm("Put the stock text back? Your version stays in the history.")) act(`/prompts/${detail.name}/reset`, {}, "Back to stock.");
    };
    $("promptDiff").onclick = () => { showDiff = !showDiff; const text = box.value; render(); $("promptText").value = text; $("promptText").oninput(); };
    if ($("useMerge")) $("useMerge").onclick = () => { box.value = detail.conflict_text; box.oninput(); };
    for (const b of $("detail").querySelectorAll("[data-restore]")) {
      b.onclick = () => {
        if (!dirty() || confirm("Discard what is in the editor?")) act(`/prompts/${detail.name}/restore`, { version: b.dataset.restore }, "Restored.");
      };
    }
  }

  async function act(path, body, done) {
    busy = true;
    try { detail = await api(path, { method: "POST", body: JSON.stringify(body) }); }
    catch (err) { busy = false; $("promptMsg").textContent = err.message; return; }
    busy = false;
    await refresh();
    render();
    $("promptMsg").textContent = done;
  }

  // ------------------------------------------------------------ Workshop --
  function renderWorkshop() {
    const s = shop || { proposals: [], unseen: 0 };
    const rows = [...s.proposals].reverse();
    return `<div class="head"><h2>Workshop</h2></div>
      <p>Say what the assistant should do differently, in your words: "shorter cover letters", "never call me passionate",
      "treat hybrid three days a week as fine". It finds the prompts that decide that and proposes the edit; nothing changes
      until you press Apply, and every applied edit can be undone from that prompt's history.</p>
      <p class="hint">What the prompts cannot change, whatever they say: nothing is ever submitted for you, visa questions are
      never answered, and the resume keeps its sections, links and length. A new button or a new website is a code change:
      ask Claude Code in the app's folder.</p>
      ${s.error ? `<div class="banner stop">${escape(s.error)}</div>` : ""}
      <textarea id="shopText" placeholder="What should work differently?"></textarea>
      <div class="actions">
        <button class="act primary" id="shopAsk" disabled>Propose the edit</button>
        <button class="act" id="shopLearn" ${s.unseen ? "" : "disabled"}>Learn from my re-tailor requests${s.unseen ? ` (${s.unseen} new)` : ""}</button>
        <label class="hint"><input type="checkbox" id="shopAuto"> learn by itself after every ${s.learn_every || 3} new requests</label>
        <span class="hint" id="shopMsg"></span>
      </div>
      ${rows.length ? rows.map(renderProposal).join("") : '<p class="empty">No requests yet.</p>'}`;
  }

  function renderProposal(p) {
    const label = { pending: "", applied: "applied", dismissed: "dismissed", failed: "could not be applied",
                    stale: "out of date", empty: "no change" }[p.state] ?? p.state;
    return `<div class="proposal" data-source="${p.source}">
      <div class="tag">${p.source === "learned" ? "learned from your requests" : "you asked"} · ${escape((p.when || "").slice(0, 16).replace("T", " "))}${label ? ` · ${escape(label)}` : ""}</div>
      <div class="req">${escape(p.source === "learned" ? (p.evidence || []).map((e) => "“" + e.text + "”").join("  ") : p.request)}</div>
      ${p.message ? `<div class="msg2">${escape(p.message)}</div>` : ""}
      ${p.error ? `<div class="banner stop">${escape(p.error)}</div>` : ""}
      ${Object.entries(p.diffs || {}).map(([name, d]) => diffHtml(d)).join("")}
      ${p.state === "pending" ? `<div class="actions">
        <button class="act primary" data-apply="${p.id}">Apply</button>
        <button class="act" data-dismiss="${p.id}">Dismiss</button></div>` : ""}
    </div>`;
  }

  function wireWorkshop() {
    const box = $("shopText");
    box.oninput = () => { $("shopAsk").disabled = !box.value.trim(); };
    api("/settings").then((s) => { $("shopAuto").checked = s.learn_prompts !== false; }).catch(() => {});
    $("shopAuto").onchange = (e) => api("/settings", { method: "POST", body: JSON.stringify({ learn_prompts: e.target.checked }) });
    $("shopAsk").onclick = () => run(() => api("/workshop", { method: "POST", body: JSON.stringify({ request: box.value }) }),
                                     "Reading the prompts and writing the edit… this takes up to a minute.");
    $("shopLearn").onclick = () => run(() => api("/workshop/learn", { method: "POST" }),
                                       "Reading your re-tailor requests across jobs…");
    for (const b of $("detail").querySelectorAll("[data-apply]"))
      b.onclick = () => run(() => api(`/workshop/${b.dataset.apply}/apply`, { method: "POST" }), "Applying…");
    for (const b of $("detail").querySelectorAll("[data-dismiss]"))
      b.onclick = () => run(() => api(`/workshop/${b.dataset.dismiss}/dismiss`, { method: "POST" }), "");
  }

  async function run(call, note) {
    busy = true;
    for (const b of $("detail").querySelectorAll("button")) b.disabled = true;
    $("shopMsg").textContent = note;
    try { await call(); }
    catch (err) { busy = false; await refresh(); render(); $("shopMsg").textContent = err.message; return; }
    busy = false;
    await refresh();
    render();
  }

  return { open, poll };
})();

// ------------------------------------------------------- Preliminary form --
// The fixed questions every application asks, one per screen, no model.
// Writes base/form.json through /profile/form; the code filler reads it.
const Form = (() => {
  let data = null;      // GET /profile/form
  let values = {};
  let corrections = {};  // label -> {value, was, system, field, when, job}
  let step = 0;         // index into asked (questions with a key, not fixed)
  let asked = [];
  let autoLearn = false;  // settings.auto_learn: the correction loop on or off

  async function open() {
    Profile.setViewing({ slug: "_form", name: "form.json" });
    try { data = await api("/profile/form"); } catch (err) { $("detail").innerHTML = `<div class="banner stop">${escape(err.message)}</div>`; return; }
    try { autoLearn = !!(await api("/settings")).auto_learn; } catch { autoLearn = false; }
    values = { ...data.values };
    corrections = { ...data.corrections };
    asked = data.questions.filter((q) => q.key && !q.fixed);
    for (const q of asked) if (!values[q.key] && q.default) values[q.key] = q.default;
    if (data.exists) summary(); else { step = 0; hints(); ask(); }
  }

  // Contact details the resume already carries, filled in where empty.
  async function hints() {
    try {
      const { hints } = await api("/profile/form/hints");
      for (const [k, v] of Object.entries(hints || {})) if (!values[k] && v) values[k] = v;
      if ($("qinput") && !$("qinput").value && values[asked[step]?.key]) $("qinput").value = values[asked[step].key];
    } catch (_) { /* hints are a convenience */ }
  }

  function sectionOf(q) {
    let sec = "";
    for (const item of data.questions) { if (item.section) sec = item.section; if (item === q) break; }
    return sec;
  }

  function ask() {
    const q = asked[step];
    const value = values[q.key] || "";
    const control = q.kind === "select"
      ? `<select id="qinput"><option value="">—</option>${q.options.map((o) => `<option ${o === value ? "selected" : ""}>${escape(o)}</option>`).join("")}</select>`
      : q.kind === "yesno"
      ? `<div class="choices">${["Yes", "No"].map((o) => `<button class="act" data-choice="${o}" aria-pressed="${o === value}">${o}</button>`).join("")}</div>`
      : `<input type="text" id="qinput" value="${escape(value)}" autocomplete="off">`;
    $("detail").innerHTML = `
      <div class="head"><h2>Preliminary interview</h2><span class="co">${step + 1} of ${asked.length} · Enter for next, blank to skip</span></div>
      <div class="card qform">
        <div class="prog"><i style="width:${Math.round(100 * step / asked.length)}%"></i></div>
        <div class="sec">${escape(sectionOf(q))}</div>
        <div class="q">${escape(q.ask)}</div>
        ${control}
        ${q.help ? `<div class="hint">${escape(q.help)}</div>` : ""}
        ${q.protected ? `<div class="prot">Kept on file for you and the screen. The filler never answers this on a form; you do.</div>` : ""}
        <div class="actions">
          <button class="act" id="qBack" ${step ? "" : "disabled"}>← Back</button>
          <button class="act primary" id="qNext">${step + 1 === asked.length ? "Finish" : "Next →"}</button>
          <button class="act" id="qSkip">Skip</button>
          <button class="act" id="qQuit">Save and stop</button>
        </div>
      </div>`;
    const input = $("qinput");
    if (input) { input.focus(); if (input.select) input.select(); }
    const read = () => { if (input) values[q.key] = input.value.trim(); };
    for (const b of $("detail").querySelectorAll("[data-choice]")) b.onclick = () => { values[q.key] = b.dataset.choice; next(); };
    $("qNext").onclick = () => { read(); next(); };
    $("qSkip").onclick = () => { values[q.key] = ""; next(); };
    $("qBack").onclick = () => { read(); step--; ask(); };
    $("qQuit").onclick = () => { read(); save(); };
    if (input) input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); read(); next(); } };
  }

  function next() {
    if (step + 1 < asked.length) { step++; ask(); } else save();
  }

  async function save() {
    try {
      data = await api("/profile/form", { method: "POST", body: JSON.stringify({ values, corrections }) });
      values = { ...data.values }; corrections = { ...data.corrections };
      Profile.form = data;
      summary();
    } catch (err) { alert(err.message); }
  }

  function summary() {
    const rows = data.questions.map((q) => q.section
      ? `<tr><td colspan="2" class="sec" style="padding-top:.9rem">${escape(q.section)}</td></tr>`
      : `<tr><td>${escape(q.ask)}</td><td class="${values[q.key] ? "" : "empty"}">${escape(values[q.key] || "not answered")}</td></tr>`).join("");
    // Newest first: the row that just landed is the one being checked.
    const corrected = Object.entries(corrections).sort((a, b) => String(b[1].when || "").localeCompare(String(a[1].when || "")));
    $("detail").innerHTML = `
      <div class="head"><h2>Form details</h2><span class="co">${data.answered}/${data.total} on file · base/form.json</span></div>
      <div class="actions">
        <button class="act" id="qClose">← Back</button>
        <button class="act primary" id="qRedo">Go through the questions</button>
      </div>
      <div class="card" style="padding:.6rem 1rem"><table class="kv">${rows}</table></div>
      <h3 style="margin-top:1.4rem">Corrected fields · ${corrected.length}</h3>
      <label class="hint" style="display:block;margin:.2rem 0 .6rem"><input type="checkbox" id="autoLearn" ${autoLearn ? "checked" : ""}> Auto-learn: list what I change on a filled form, and put the fields below over autofill on the next one. Off, nothing is listed and nothing below is applied.</label>
      <p class="hint">A field you changed on a form before submitting. On every next form that asks it, the value you set goes over what autofill put there. Delete a row to stop that.</p>
      <div class="card" style="padding:.6rem 1rem"><table class="kv corr" id="corrTable">
        ${corrected.length ? `<tr class="th"><td>Field</td><td>Form filled</td><td>You corrected</td><td>Where</td><td></td></tr>` : ""}
        ${corrected.map(([k, r]) => `<tr>
          <td title="${escape(fieldTitle(r))}">${escape(k)}</td>
          <td class="${r.was ? "was" : "empty"}">${escape(r.was || "blank")}</td>
          <td>${escape(r.value)}</td>
          <td class="empty">${escape([r.system, r.when].filter(Boolean).join(" · ") || "—")}</td>
          <td><button class="act" data-del="${escape(k)}">✕</button></td></tr>`).join("")
          || `<tr><td class="empty" colspan="5">nothing yet — fill a form, fix what is wrong, submit</td></tr>`}
      </table></div>`;
    $("qClose").onclick = () => Profile.back();
    $("qRedo").onclick = () => { step = 0; ask(); };
    $("autoLearn").onchange = async (e) => {
      autoLearn = e.target.checked;
      try { await api("/settings", { method: "POST", body: JSON.stringify({ auto_learn: autoLearn }) }); }
      catch (err) { e.target.checked = autoLearn = !autoLearn; alert(err.message); }
    };
    for (const b of $("detail").querySelectorAll("[data-del]")) b.onclick = () => { delete corrections[b.dataset.del]; save(); };
  }

  // The control the correction was read off, for the hover: which input
  // on which system, so two forms wording one question alike can be told apart.
  function fieldTitle(r) {
    const f = r.field || {};
    return [f.kind, f.id && `#${f.id}`, f.name && `name=${f.name}`, r.job && `from ${r.job}`].filter(Boolean).join(" ");
  }

  return { open };
})();

// ---------------------------------------------------------------- Profile --
// The interviewer. Text goes over SSE; voice is optional on both ends and
// falls back to the browser's own speech APIs when the local binaries are
// not there. The interview loop is the same either way.
const Profile = (() => {
  let state = null;       // GET /profile
  let form = null;        // GET /profile/form, for the nav line
  let voice = null;       // GET /voice/status
  let busy = false;       // a turn is streaming
  let viewing = null;     // {slug, name} when reading a document
  // The chat is the voice: every reply is spoken, the mic reopens after
  // each one, and the transcript is the same text either way. The orb
  // pauses it; typing still works while paused.
  const speak = true;
  let paused = false;
  let listenNext = false; // reopen the mic once the reply has been spoken

  async function open() {
    viewing = null;
    await Promise.all([refresh(), refreshVoice()]);
    render();
    greet();
  }

  // Leaving the chat: nothing keeps talking or listening behind another view.
  function leave() {
    listenNext = false;
    Voice.interrupt();
    Voice.cancelListening();
    $("detail").classList.remove("chatpane");
  }

  // Entering the chat: the open question is spoken, then the mic opens.
  function greet() {
    if (!state || state.error || viewing || state.phase === "new" || busy || paused) return;
    const last = [...state.transcript].reverse().find((m) => m.role === "assistant");
    listenNext = true;
    if (last) say(last.content); else speechDone();
  }

  async function refresh() {
    try { state = await api("/profile"); } catch (err) { state = { error: err.message }; }
    try { form = await api("/profile/form"); } catch (_) { form = null; }
  }
  async function refreshVoice() {
    try { voice = await api("/voice/status"); } catch (_) { voice = null; }
  }

  // Cheap poll: children generation and downloads finish in the background.
  async function poll() {
    if (busy || view !== "profile") return;
    const pending = state?.experiences?.some((e) => e.children === "pending");
    const downloading = voice?.downloading;
    if (!pending && !downloading) return;
    await Promise.all([pending ? refresh() : null, downloading ? refreshVoice() : null]);
    renderNav();
    renderVoiceBar();
  }

  function render() {
    renderNav();
    $("detail").classList.remove("chatpane");
    if (!state) return;
    if (state.error) {
      $("detail").innerHTML = `<div class="banner stop">${escape(state.error)}</div>`;
      return;
    }
    if (viewing) return renderDocument();
    if (state.phase === "new") { leave(); return renderStart(); }
    renderChat();
  }

  function renderNav() {
    if (!state || !state.experiences) { $("list").innerHTML = ""; return; }
    const groups = [["role", "Roles"], ["project", "Projects"]];
    const factsNote = state.has_facts ? "on file" : state.phase === "facts"
      ? `asking · ${state.facts?.asked || 0}/${state.facts?.total || 0}` : "not yet";
    const formNote = form ? (form.exists ? `${form.answered}/${form.total} on file` : "not yet") : "";
    let html = `<div class="group">Facts</div>
      <button class="row" data-facts="1" data-tone="${state.has_facts ? "done" : "you"}" aria-current="${viewing?.slug === "_facts"}">
        <span class="role">About you</span>
        <span class="cov">${escape(factsNote)}</span>
      </button>
      <button class="row" data-form="1" data-tone="${form?.exists ? "done" : "you"}" aria-current="${viewing?.slug === "_form"}">
        <span class="role">Form details</span>
        <span class="cov">${escape(formNote)}</span>
      </button>`;
    for (const [kind, heading] of groups) {
      const items = state.experiences.filter((e) => e.kind === kind);
      if (!items.length) continue;
      html += `<div class="group">${heading} · ${items.length}</div>`;
      html += items.map((e) => `
        <button class="row" data-slug="${escape(e.slug)}" data-tone="${rowTone(e)}"
                aria-current="${viewing ? viewing.slug === e.slug : e.slug === state.current}">
          <span class="role">${escape(e.title)}</span>
          <span class="cov">${coverage(e)}</span>
        </button>`).join("");
    }
    $("list").innerHTML = html;
    for (const button of $("list").querySelectorAll("button[data-slug]")) {
      button.onclick = () => openDocument(button.dataset.slug, "main.md");
    }
    $("list").querySelector("button[data-facts]").onclick = () => openFacts();
    $("list").querySelector("button[data-form]").onclick = () => Form.open();
    $("count").textContent = state.experiences.length
      ? `${state.experiences.filter((e) => e.closed).length}/${state.experiences.length} experiences done`
      : "";
  }

  // Row colour: purple while the agent writes, green when it is your turn
  // (asking now, or not started), plain once the documents are on file.
  function rowTone(e) {
    if (e.children === "pending") return "agent";
    if (e.closed) return "done";
    return "you";
  }

  function coverage(e) {
    const cov = e.total ? `${e.covered}/${e.total} covered` : "not started";
    if (!e.closed) return e.slug === state.current ? `${cov} · asking now` : cov;
    const child = { none: "", pending: '<span class="pend">writing documents…</span>',
      ready: '<span class="ok">documents ready</span>',
      error: '<span class="err">documents failed</span>' }[e.children] || "";
    return `${cov}${child ? " · " + child : ""}`;
  }

  function renderStart() {
    $("detail").innerHTML = `
      <div class="head"><h2>Profile interview</h2></div>
      <p>I read your resume, then ask two things. First the facts it cannot tell me — work
      authorisation, clearance, level, relocation, start date — eight short questions that
      become the file the auto-reject screen and the form fill read. Then your stories: each
      role and project, one at a time, the way an interviewer would. Those become one document
      per experience; the tailor swaps in the right story for each posting, and you get a STAR
      write-up to reread before interviews. Stop any time; the next question picks up where you
      left off.</p>
      ${state.has_resume ? "" : `<div class="banner stop">No resume found. The interview starts from the resume.</div>`}
      <h3>Anything else to hand over (optional)</h3>
      <textarea id="seed" placeholder="Notes, an old resume, a project README… pasted here or picked below (PDF, text, markdown; several files are fine). Used once to find experiences, then discarded."></textarea>
      <div class="actions">
        <label class="act filepick" for="seedFile">Choose files (PDF, text, markdown)</label>
        <input type="file" id="seedFile" accept=".pdf,.txt,.md,.tex,application/pdf,text/plain,text/markdown" multiple>
        <span class="hint" id="seedNote">No file chosen</span>
      </div>
      <div class="actions">
        <button class="act primary" id="startInterview" ${state.has_resume ? "" : "disabled"}>Start the interview</button>
        <button class="act" id="startForm">Preliminary interview</button>
        <span class="hint">Form details first: the fixed questions every application asks, click-through, no voice.</span>
      </div>`;
    $("startForm").onclick = () => Form.open();
    // Files go to the server for text extraction (PDFs need pypdf); each
    // lands in the box under its own heading so the model knows what is what.
    $("seedFile").onchange = async (event) => {
      const files = [...event.target.files];
      const note = $("seedNote");
      note.textContent = `Reading ${files.length} file${files.length === 1 ? "" : "s"}…`;
      const failed = [];
      for (const file of files) {
        try {
          const res = await fetch("/profile/seed-file", { method: "POST",
            headers: { "X-Filename": file.name, "Content-Type": "application/octet-stream" }, body: file });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          $("seed").value = [$("seed").value.trim(), `## ${file.name}\n\n${body.text.trim()}`]
            .filter(Boolean).join("\n\n");
        } catch (err) { failed.push(`${file.name}: ${err.message}`); }
      }
      const total = $("seed").value.length;
      note.textContent = (failed.length ? failed.join("; ") + ". " : "")
        + `${total.toLocaleString()} characters${total > 40000 ? " (only the first 40,000 are used)" : ""}.`;
      event.target.value = "";
    };
    $("startInterview").onclick = async () => {
      const button = $("startInterview");
      button.disabled = true; button.textContent = "Reading the resume…";
      try {
        const result = await api("/profile/start", { method: "POST", body: JSON.stringify({ seed: $("seed").value }) });
        state = result.status;
        render();
        listenNext = true;
        say(result.message);
      } catch (err) { alert(err.message); button.disabled = false; button.textContent = "Start the interview"; }
    };
  }

  function renderChat() {
    const title = state.phase === "open" ? "All experiences covered — tell me anything new"
      : state.phase === "setup" ? "Before the stories"
      : state.phase === "facts" ? "About you"
      : (state.experiences.find((e) => e.slug === state.current) || {}).title || "Interview";
    const sub = { facts: `facts · ${state.facts?.asked || 0}/${state.facts?.total || 0}`, setup: "checking the list",
